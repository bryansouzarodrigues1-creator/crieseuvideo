          }
        }

        // =====================================================================
        // MÓDULO 2: PaperActor2D — PERSONAGEM PLANO 2D (NOTA R$ 100 ESTILIZADA)
        // =====================================================================
        class PaperActor2D {
          constructor(cfg) {
            this.group = new THREE.Group();
            this.group.name = 'PaperActor2D';
            this.basePos = cfg.basePos;
            this.group.position.set(cfg.basePos.x, cfg.basePos.y, cfg.basePos.z);

            this.bodyPivot = new THREE.Group();
            this.group.add(this.bodyPivot);

            this.faceTextures = {};
            this.faceMat = null;
            this.currentExpr = '';
            this.leftArmPivot = null;
            this.rightArmPivot = null;
            this.leftLegPivot = null;
            this.rightLegPivot = null;
            this.sweatDrops = [];

            this.build();
          }

          createBanknoteTexture() {
            return createCanvasTexture(512, 860, function (g, w, h) {
              g.clearRect(0, 0, w, h);

              // Sombra interna + corpo da nota R$ 100 com contorno preto grosso
              const pad = 22;
              const bw = w - pad * 2;
              const bh = h - pad * 2;

              // Fundo principal azul-ciano da nota de R$ 100
              const grad = g.createLinearGradient(0, pad, w, h - pad);
              grad.addColorStop(0, '#a5e1f5');
              grad.addColorStop(0.5, '#78c9e8');
              grad.addColorStop(1, '#58b4da');

              drawRoundedRect(g, pad, pad, bw, bh, 36);
              g.fillStyle = grad;
              g.fill();

              // Faixas geométricas sutis de segurança
              g.save();
              drawRoundedRect(g, pad + 6, pad + 6, bw - 12, bh - 12, 30);
              g.clip();

              g.fillStyle = 'rgba(255, 255, 255, 0.24)';
              g.fillRect(pad + 26, pad + 26, bw - 52, bh - 52);

              g.fillStyle = 'rgba(14, 116, 144, 0.14)';
              g.fillRect(pad, h - 220, bw, 220);

              // Ondas sutis de fundo
              g.strokeStyle = 'rgba(255, 255, 255, 0.35)';
              g.lineWidth = 6;
              for (let i = 0; i < 4; i++) {
                g.beginPath();
                g.arc(w * 0.5, h * 0.22 + i * 24, 150 + i * 16, 0.15, Math.PI - 0.15);
                g.stroke();
              }

              // Emblema estilizado do peixe (Garoupa da nota de 100) na base
              g.save();
              g.translate(w * 0.45, h - 140);
              g.fillStyle = 'rgba(21, 94, 117, 0.42)';
              g.strokeStyle = 'rgba(15, 70, 90, 0.65)';
              g.lineWidth = 5;
              // Corpo do peixe
              g.beginPath();
              g.ellipse(0, 0, 86, 40, 0, 0, Math.PI * 2);
              g.fill();
              g.stroke();
              // Cauda
              g.beginPath();
              g.moveTo(76, 0);
              g.lineTo(122, -32);
              g.lineTo(116, 32);
              g.closePath();
              g.fill();
              g.stroke();
              // Olho do peixe
              g.fillStyle = '#e0f2fe';
              g.beginPath();
              g.arc(-48, -8, 7, 0, Math.PI * 2);
              g.fill();
              g.restore();

              // Numerais "100" nítidos (nunca espelhados)
              g.fillStyle = '#0e4f6b';
              g.font = '900 72px Inter, sans-serif';
              g.textAlign = 'left';
              g.textBaseline = 'top';
              g.fillText('100', pad + 34, pad + 32);

              g.font = '900 56px Inter, sans-serif';
              g.textAlign = 'right';
              g.textBaseline = 'bottom';
              g.fillText('100', w - pad - 34, h - pad - 28);

              // Texto lateral vertical "BANCO CENTRAL DO BRASIL"
              g.save();
              g.translate(w - pad - 44, h * 0.52);
              g.rotate(-Math.PI / 2);
              g.fillStyle = 'rgba(14, 79, 107, 0.72)';
              g.font = '800 20px Inter, sans-serif';
              g.textAlign = 'center';
              g.fillText('BANCO CENTRAL DO BRASIL', 0, 0);
              g.restore();

              g.restore();

              // Contorno preto grosso cartoon
              drawRoundedRect(g, pad, pad, bw, bh, 36);
              g.strokeStyle = '#18181b';
              g.lineWidth = 22;
              g.stroke();
            });
          }

          createExpressionTexture(expr) {
            return createCanvasTexture(512, 512, function (g, w, h) {
              g.clearRect(0, 0, w, h);
              const ink = '#18181b';

              if (expr === 'worried_sweating') {
                // Sobrancelhas preocupadas inclinadas para cima no centro
                g.strokeStyle = ink;
                g.lineWidth = 18;
                g.lineCap = 'round';
                g.beginPath(); g.moveTo(126, 175); g.lineTo(195, 142); g.stroke();
                g.beginPath(); g.moveTo(386, 175); g.lineTo(317, 142); g.stroke();

                // Olhos ovais escuros
                g.fillStyle = ink;
                g.beginPath(); g.ellipse(174, 232, 22, 32, 0, 0, Math.PI * 2); g.fill();
                g.beginPath(); g.ellipse(338, 232, 22, 32, 0, 0, Math.PI * 2); g.fill();

                // Brilho nos olhos
                g.fillStyle = '#ffffff';
                g.beginPath(); g.arc(166, 218, 7, 0, Math.PI * 2); g.fill();
                g.beginPath(); g.arc(330, 218, 7, 0, Math.PI * 2); g.fill();

                // Boca ondulada tensa de calor
                g.strokeStyle = ink;
                g.lineWidth = 18;
                g.beginPath();
                g.moveTo(175, 344);
                g.quadraticCurveTo(214, 316, 256, 344);
                g.quadraticCurveTo(298, 372, 337, 344);
                g.stroke();

                // Gota de suor fixa na testa
                g.fillStyle = '#38bdf8';
                g.strokeStyle = ink;
                g.lineWidth = 10;
                g.beginPath();
                g.moveTo(412, 112);
                g.quadraticCurveTo(444, 168, 412, 186);
                g.quadraticCurveTo(380, 168, 412, 112);
                g.closePath();
                g.fill();
                g.stroke();

              } else if (expr === 'shocked') {
                // Sobrancelhas bem levantadas
                g.strokeStyle = ink;
                g.lineWidth = 16;
                g.lineCap = 'round';
                g.beginPath(); g.arc(174, 152, 42, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
                g.beginPath(); g.arc(338, 152, 42, Math.PI * 1.15, Math.PI * 1.85); g.stroke();

                // Olhos grandes brancos olhando para cima (para o preço!)
                const xs = [174, 338];
                for (let i = 0; i < 2; i++) {
                  g.fillStyle = '#ffffff';
                  g.strokeStyle = ink;
                  g.lineWidth = 14;
                  g.beginPath(); g.arc(xs[i], 224, 46, 0, Math.PI * 2); g.fill(); g.stroke();
                  g.fillStyle = ink;
                  g.beginPath(); g.arc(xs[i], 204, 17, 0, Math.PI * 2); g.fill();
                }

                // Boca "O" espantada
                g.fillStyle = '#18181b';
                g.beginPath();
                g.ellipse(256, 352, 38, 52, 0, 0, Math.PI * 2);
                g.fill();
                g.fillStyle = '#ef4444';
                g.beginPath();
                g.ellipse(256, 382, 22, 14, 0, 0, Math.PI * 2);
                g.fill();

              } else if (expr === 'smug') {
                // Olhar esperto (pálpebras semicerradas confiantes)
                const xs = [174, 338];
                for (let i = 0; i < 2; i++) {
                  g.fillStyle = ink;
                  g.beginPath();
                  g.arc(xs[i], 226, 30, 0, Math.PI);
                  g.closePath();
                  g.fill();
                  // Linha superior da pálpebra
                  g.strokeStyle = ink;
                  g.lineWidth = 16;
                  g.lineCap = 'round';
                  g.beginPath();
                  g.moveTo(xs[i] - 42, 224);
                  g.lineTo(xs[i] + 42, 224);
                  g.stroke();
                }

                // Sorriso de canto esperto
                g.strokeStyle = ink;
                g.lineWidth = 18;
                g.lineCap = 'round';
                g.beginPath();
                g.moveTo(188, 338);
                g.quadraticCurveTo(268, 362, 344, 314);
                g.stroke();

              } else if (expr === 'happy') {
                // Bochechas rosadas
                g.fillStyle = 'rgba(244, 114, 182, 0.42)';
                g.beginPath(); g.ellipse(112, 276, 36, 20, 0, 0, Math.PI * 2); g.fill();
                g.beginPath(); g.ellipse(400, 276, 36, 20, 0, 0, Math.PI * 2); g.fill();

                // Olhos felizes em arco ^ ^
                g.strokeStyle = ink;
                g.lineWidth = 20;
                g.lineCap = 'round';
                g.beginPath(); g.arc(174, 232, 34, Math.PI * 1.12, Math.PI * 1.88); g.stroke();
                g.beginPath(); g.arc(338, 232, 34, Math.PI * 1.12, Math.PI * 1.88); g.stroke();

                // Sorriso aberto com dentes brancos
                g.fillStyle = '#ffffff';
                g.strokeStyle = ink;
                g.lineWidth = 16;
                g.beginPath();
                g.moveTo(148, 300);
                g.lineTo(364, 300);
                g.quadraticCurveTo(356, 412, 256, 412);
                g.quadraticCurveTo(156, 412, 148, 300);
                g.closePath();
                g.fill();
                g.stroke();

                // Linha interna dos dentes
                g.beginPath();
                g.moveTo(164, 346);
                g.lineTo(348, 346);
                g.stroke();
              }
            });
          }

          build() {
            // 1) Sombra oval macia no chão (y = 0.022 -> acima do tapete y = 0.008)
            const shadowTex = createCanvasTexture(128, 128, function (g, w, h) {
              const gr = g.createRadialGradient(w / 2, h / 2, 6, w / 2, h / 2, w * 0.46);
              gr.addColorStop(0, 'rgba(15, 18, 25, 0.48)');
              gr.addColorStop(1, 'rgba(15, 18, 25, 0)');
              g.fillStyle = gr;
              g.fillRect(0, 0, w, h);
            });
            const shadowPlane = new THREE.Mesh(
              new THREE.PlaneGeometry(1.18, 0.56),
              new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
            );
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.position.set(0, 0.022, 0);
            this.group.add(shadowPlane);

            // 2) Corpo 2D plano da Nota R$ 100 (largura 0.86, altura 1.44, base em y = 0.34)
            const bodyW = 0.86;
            const bodyH = 1.44;
            const bodyCenterY = 1.06; // vai de y = 0.34 até y = 1.78

            const noteTex = this.createBanknoteTexture();
            const bodyMat = new THREE.MeshBasicMaterial({
              map: noteTex,
              transparent: true,
              alphaTest: 0.25,
              side: THREE.DoubleSide
            });
            const bodyPlane = new THREE.Mesh(new THREE.PlaneGeometry(bodyW, bodyH), bodyMat);
            bodyPlane.position.set(0, bodyCenterY, 0);
            this.bodyPivot.add(bodyPlane);

            // 3) Placa de Expressão Facial (folga real +0.06 na frente -> zero z-fighting!)
            const exprKeys = ['worried_sweating', 'shocked', 'smug', 'happy'];
            for (let i = 0; i < exprKeys.length; i++) {
              this.faceTextures[exprKeys[i]] = this.createExpressionTexture(exprKeys[i]);
            }
            this.faceMat = new THREE.MeshBasicMaterial({
              map: this.faceTextures.worried_sweating,
              transparent: true,
              alphaTest: 0.05,
              depthWrite: false
            });
            const facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.66, 0.66), this.faceMat);
            facePlane.position.set(0, 1.15, 0.06);
            this.bodyPivot.add(facePlane);

            // 4) Braços e Pernas articulados (palito cartoon grosso com mãos/pés arredondados)
            const limbMat = new THREE.MeshBasicMaterial({ color: '#18181b' });

            function createLimb(len, radius, hasFoot) {
              const piv = new THREE.Group();
              const rod = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 10), limbMat);
              rod.position.y = -len / 2;
              const tip = new THREE.Mesh(new THREE.SphereGeometry(hasFoot ? radius * 1.65 : radius * 1.55, 10, 8), limbMat);
              tip.position.set(0, -len, hasFoot ? 0.04 : 0);
              if (hasFoot) tip.scale.set(1.0, 0.72, 1.65);
              piv.add(rod, tip);
              return piv;
            }

            // Braço esquerdo (lado -X do observador)
            this.leftArmPivot = createLimb(0.46, 0.032, false);
            this.leftArmPivot.position.set(-0.39, 1.05, -0.02);
            this.bodyPivot.add(this.leftArmPivot);

            // Braço direito (lado +X do observador)
            this.rightArmPivot = createLimb(0.46, 0.032, false);
            this.rightArmPivot.position.set(0.39, 1.05, -0.02);
            this.bodyPivot.add(this.rightArmPivot);

            // Pernas
            this.leftLegPivot = createLimb(0.36, 0.036, true);
            this.leftLegPivot.position.set(-0.18, 0.37, -0.01);
            this.group.add(this.leftLegPivot);

            this.rightLegPivot = createLimb(0.36, 0.036, true);
            this.rightLegPivot.position.set(0.18, 0.37, -0.01);
            this.group.add(this.rightLegPivot);

            // 5) Gotinhas de suor animadas (ativas no ato 1 — Verão 40°C)
            const dropTex = createCanvasTexture(96, 128, function (g, w, h) {
              g.clearRect(0, 0, w, h);
              g.fillStyle = '#38bdf8';
              g.strokeStyle = '#18181b';
              g.lineWidth = 10;
              g.beginPath();
              g.moveTo(w / 2, 12);
              g.quadraticCurveTo(w - 14, h * 0.72, w / 2, h - 12);
              g.quadraticCurveTo(14, h * 0.72, w / 2, 12);
              g.closePath();
              g.fill();
              g.stroke();
            });
            const dropMat = new THREE.MeshBasicMaterial({
              map: dropTex,
              transparent: true,
              alphaTest: 0.1
            });
            const dropConfigs = [
              { x: -0.52, y0: 1.62, phase: 0.0 },
              { x:  0.54, y0: 1.68, phase: 0.35 },
              { x:  0.44, y0: 1.85, phase: 0.7 }
            ];
            for (let i = 0; i < dropConfigs.length; i++) {
              const d = new THREE.Mesh(new THREE.PlaneGeometry(0.13, 0.17), dropMat);
              d.userData = dropConfigs[i];
              d.position.set(dropConfigs[i].x, dropConfigs[i].y0, 0.08);
              this.bodyPivot.add(d);
              this.sweatDrops.push(d);
            }
          }

          setExpression(expr) {
            if (this.currentExpr === expr) return;
            if (!this.faceTextures[expr]) return;
            this.currentExpr = expr;
            this.faceMat.map = this.faceTextures[expr];
            this.faceMat.needsUpdate = true;
          }

          update(t) {
            // Descobre qual cue está ativo no tempo determinístico t
            let activeCue = SCENE_SPEC.actor.cues[0];
            for (let i = 0; i < SCENE_SPEC.actor.cues.length; i++) {
              const c = SCENE_SPEC.actor.cues[i];
              if (t >= c.t0 && t < c.t1) {
                activeCue = c;
                break;
              }
              if (t >= c.t1) activeCue = c;
            }

            this.setExpression(activeCue.expression);

            // Reset base
            let bobY = 0;
            let tiltZ = 0;
            let laZ = -0.35;
            let raZ = 0.35;

            if (activeCue.pose === 'worried_wave') {
              // Balança os braços nervoso com o calor
              bobY = Math.sin(t * 9.0) * 0.025;
              tiltZ = Math.sin(t * 5.2) * 0.045;
              laZ = -0.75 + Math.sin(t * 12.0) * 0.35;
              raZ =  0.75 - Math.sin(t * 12.0 + 0.8) * 0.35;
            } else if (activeCue.pose === 'shocked_up') {
              // Susto ao ver o preço de R$ 3.999
              const p = easeOutBack(invLerp(1.8, 2.25, t));
              bobY = Math.sin(clamp((t - 1.8) * 6, 0, Math.PI)) * 0.08 + Math.sin(t * 7.0) * 0.015;
              tiltZ = Math.sin(t * 4.0) * 0.02;
              laZ = lerp(-0.5, -1.95, clamp(p, 0, 1.1)) + Math.sin(t * 10) * 0.06;
              raZ = lerp( 0.5,  1.95, clamp(p, 0, 1.1)) - Math.sin(t * 10) * 0.06;
            } else if (activeCue.pose === 'point_up') {
              // Olhar esperto apontando para cima (para a placa de desconto!)
              const p = easeOutBack(invLerp(4.6, 5.05, t));
              bobY = Math.sin(t * 4.5) * 0.02;
              tiltZ = -0.05 * clamp(p, 0, 1);
              laZ = -0.42;
              raZ = lerp(0.4, 2.55, clamp(p, 0, 1.08)) + Math.sin(t * 8.0) * 0.08;
            } else if (activeCue.pose === 'celebrate') {
              // Comemoração alegre com saltinhos e dois braços erguidos
              const jump = Math.abs(Math.sin((t - 6.4) * 6.5));
              bobY = jump * 0.14;
              tiltZ = Math.sin((t - 6.4) * 6.5) * 0.06;
              laZ = -2.55 + Math.sin(t * 14) * 0.18;
              raZ =  2.55 - Math.sin(t * 14) * 0.18;
            }

            this.bodyPivot.position.y = bobY;
            this.bodyPivot.rotation.z = tiltZ;
            this.leftArmPivot.rotation.z = laZ;
            this.rightArmPivot.rotation.z = raZ;

            // Leve movimento nas pernas durante comemoração
            const legKick = activeCue.pose === 'celebrate' ? Math.abs(Math.sin((t - 6.4) * 6.5)) * 0.14 : 0;
            this.leftLegPivot.rotation.z = -legKick;
            this.rightLegPivot.rotation.z = legKick;

            // Gotinhas de suor determinísticas (somente no verão 0.0s - 1.85s)
            const showSweat = t < 1.85;
            for (let i = 0; i < this.sweatDrops.length; i++) {
              const d = this.sweatDrops[i];
              d.visible = showSweat;
              if (showSweat) {
                const cycle = (t * 1.45 + d.userData.phase) % 1;
                d.position.y = d.userData.y0 - cycle * 0.34;
                const sc = Math.sin(cycle * Math.PI);
                d.scale.setScalar(Math.max(0.01, sc));
              }
            }
          }
        }

        // =====================================================================
        // MÓDULO 3: SpriteProp2D — PROPS 2D COM CONTORNO EM PROFUNDIDADES Z
        // =====================================================================
        class SpriteProp2D {
          constructor(roomSpec) {
            this.group = new THREE.Group();
            this.group.name = 'SpriteProp2D';
            this.roomSpec = roomSpec;

            this.thermoMesh = null;
            this.thermoHotTex = null;
            this.thermoColdTex = null;
            this.sunMesh = null;
            this.heatWaves = [];
            this.coldStreams = [];
            this.snowflakes = [];
            this.sparkles = [];
            this.plantMesh = null;

            this.build();
          }

          build() {
            const bz = this.roomSpec.backWallZ;
            const win = this.roomSpec.windowRect;
            const winCx = (win.xMin + win.xMax) / 2;
            const winCy = (win.yMin + win.yMax) / 2;

            // 1) Aparelho de Ar-Condicionado Split na parede direita (z = bz + 0.16)
            const acTex = createCanvasTexture(512, 220, function (g, w, h) {
              g.clearRect(0, 0, w, h);
              drawRoundedRect(g, 18, 18, w - 36, h - 36, 26);
              const gr = g.createLinearGradient(0, 18, 0, h - 18);
              gr.addColorStop(0, '#ffffff');
              gr.addColorStop(1, '#e2e8f0');
              g.fillStyle = gr;
              g.fill();
              g.strokeStyle = '#18181b';
              g.lineWidth = 16;
              g.stroke();

              // Grade frontal / saída de ar
              drawRoundedRect(g, 52, h - 78, w - 104, 34, 10);
              g.fillStyle = '#334155';
              g.fill();
              g.strokeStyle = '#18181b';
              g.lineWidth = 8;
              g.stroke();

              // LED indicador verde/azul
              g.fillStyle = '#22c55e';
              g.beginPath(); g.arc(w - 72, 62, 11, 0, Math.PI * 2); g.fill();
              g.strokeStyle = '#18181b'; g.lineWidth = 5; g.stroke();

              // Display "AR"
              g.fillStyle = '#0f172a';
              g.font = '900 32px Inter, sans-serif';
              g.fillText('SPLIT', 56, 76);
            });
            const acMesh = new THREE.Mesh(
              new THREE.PlaneGeometry(1.52, 0.65),
              new THREE.MeshBasicMaterial({ map: acTex, transparent: true, alphaTest: 0.25 })
            );
            acMesh.position.set(1.22, 2.38, bz + 0.16);
            this.group.add(acMesh);

            // Ondas de calor (Verão) saindo do AC
            const heatTex = createCanvasTexture(128, 256, function (g, w, h) {
              g.clearRect(0, 0, w, h);
              g.strokeStyle = '#f97316';
              g.lineWidth = 14;
              g.lineCap = 'round';
              g.beginPath();
              g.moveTo(w * 0.5, h - 22);
              g.bezierCurveTo(w * 0.15, h * 0.68, w * 0.85, h * 0.35, w * 0.5, 22);
              g.stroke();
            });
            const heatMat = new THREE.MeshBasicMaterial({ map: heatTex, transparent: true, depthWrite: false });
            for (let i = 0; i < 3; i++) {
              const hw = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.52), heatMat);
              hw.userData = { x0: 0.84 + i * 0.38, y0: 1.98, phase: i * 0.33 };
              hw.position.set(hw.userData.x0, hw.userData.y0, bz + 0.28);
              this.group.add(hw);
              this.heatWaves.push(hw);
            }

            // Fluxos de ar frio azul-ciano (Inverno) saindo do AC
            const coldTex = createCanvasTexture(128, 256, function (g, w, h) {
              g.clearRect(0, 0, w, h);
              g.strokeStyle = '#38bdf8';
              g.lineWidth = 14;
              g.lineCap = 'round';
              g.beginPath();
              g.moveTo(w * 0.5, 22);
              g.bezierCurveTo(w * 0.8, h * 0.35, w * 0.2, h * 0.68, w * 0.5, h - 22);
              g.stroke();
            });
            const coldMat = new THREE.MeshBasicMaterial({ map: coldTex, transparent: true, depthWrite: false });
            for (let i = 0; i < 3; i++) {
              const cs = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.56), coldMat);
              cs.userData = { x0: 0.84 + i * 0.38, y0: 2.02, phase: i * 0.33 };
              cs.position.set(cs.userData.x0, cs.userData.y0, bz + 0.28);
              cs.visible = false;
              this.group.add(cs);
              this.coldStreams.push(cs);
            }

            // 2) Termômetro de Parede 40°C / 12°C (entre a janela e o AC, z = bz + 0.12)
            function makeThermoTex(tempStr, bgHex, iconType) {
              return createCanvasTexture(256, 128, function (g, w, h) {
                g.clearRect(0, 0, w, h);
                drawRoundedRect(g, 10, 12, w - 20, h - 24, 24);
                g.fillStyle = bgHex;
                g.fill();
                g.strokeStyle = '#18181b';
                g.lineWidth = 12;
                g.stroke();

                g.fillStyle = '#ffffff';
                g.font = '900 54px Inter, sans-serif';
                g.textAlign = 'center';
                g.textBaseline = 'middle';
                g.fillText(tempStr, w * 0.56, h * 0.54);

                // Pequeno ícone de bolinha quente/fria à esquerda
                g.fillStyle = iconType === 'hot' ? '#fde047' : '#e0f2fe';
                g.beginPath();
                g.arc(50, h * 0.52, 16, 0, Math.PI * 2);
                g.fill();
                g.strokeStyle = '#18181b';
                g.lineWidth = 5;
                g.stroke();
              });
            }

            this.thermoHotTex = makeThermoTex('40°C', '#ef4444', 'hot');
            this.thermoColdTex = makeThermoTex('12°C', '#0284c7', 'cold');
            this.thermoMesh = new THREE.Mesh(
              new THREE.PlaneGeometry(0.84, 0.42),
              new THREE.MeshBasicMaterial({ map: this.thermoHotTex, transparent: true, alphaTest: 0.2 })
            );
            this.thermoMesh.position.set(0.18, 2.08, bz + 0.12);
            this.group.add(this.thermoMesh);

            // 3) Planta em Vaso 2D no PRIMEIRO PLANO ESQUERDO (z = +0.58 -> paralaxe imediata!)
            const plantTex = createCanvasTexture(320, 420, function (g, w, h) {
              g.clearRect(0, 0, w, h);
              const ink = '#18181b';

              // Folhas verdes cartoon com contorno grosso
              const leaves = [
                { cx: 160, cy: 135, rx: 34, ry: 95, rot: 0,    col: '#22c55e' },
                { cx: 108, cy: 175, rx: 30, ry: 82, rot: -0.5, col: '#16a34a' },
                { cx: 212, cy: 175, rx: 30, ry: 82, rot:  0.5, col: '#16a34a' },
                { cx: 78,  cy: 225, rx: 24, ry: 62, rot: -0.9, col: '#4ade80' },
                { cx: 242, cy: 225, rx: 24, ry: 62, rot:  0.9, col: '#4ade80' }
              ];
              for (let i = 0; i < leaves.length; i++) {
                const lf = leaves[i];
                g.save();
                g.translate(lf.cx, lf.cy);
                g.rotate(lf.rot);
                g.fillStyle = lf.col;
                g.strokeStyle = ink;
                g.lineWidth = 12;
                g.beginPath();
                g.ellipse(0, 0, lf.rx, lf.ry, 0, 0, Math.PI * 2);
                g.fill();
                g.stroke();
                g.restore();
              }

              // Vaso terracota
              g.fillStyle = '#c26539';
              g.strokeStyle = ink;
              g.lineWidth = 14;
              g.beginPath();
              g.moveTo(86, 260);
              g.lineTo(234, 260);
              g.lineTo(212, 396);
              g.lineTo(108, 396);
              g.closePath();
              g.fill();
              g.stroke();

              // Borda superior do vaso
              drawRoundedRect(g, 74, 240, 172, 36, 12);
              g.fillStyle = '#d97746';
              g.fill();
              g.stroke();
            });
            this.plantMesh = new THREE.Mesh(
              new THREE.PlaneGeometry(1.06, 1.38),
              new THREE.MeshBasicMaterial({ map: plantTex, transparent: true, alphaTest: 0.25 })
            );
            this.plantMesh.position.set(-1.58, 0.69, 0.56);
            this.group.add(this.plantMesh);

            // 4) Sol Brilhante girando atrás da janela (z = outdoorSkyZ + 0.35)
            const sunTex = createCanvasTexture(256, 256, function (g, w, h) {
              g.clearRect(0, 0, w, h);
              g.translate(w / 2, h / 2);
              // Raios cartoon
              g.fillStyle = '#facc15';
              g.strokeStyle = '#18181b';
              g.lineWidth = 8;
              for (let i = 0; i < 10; i++) {
                g.save();
                g.rotate((i / 10) * Math.PI * 2);
                g.beginPath();
                g.moveTo(-14, -76);
                g.lineTo(0, -116);
                g.lineTo(14, -76);
                g.closePath();
                g.fill();
                g.stroke();
                g.restore();
              }
              g.beginPath();
              g.arc(0, 0, 62, 0, Math.PI * 2);
              g.fillStyle = '#fde047';
              g.fill();
              g.stroke();
            });
            this.sunMesh = new THREE.Mesh(
              new THREE.PlaneGeometry(1.12, 1.12),
              new THREE.MeshBasicMaterial({ map: sunTex, transparent: true, alphaTest: 0.1 })
            );
            this.sunMesh.position.set(winCx + 0.38, winCy + 0.26, this.roomSpec.outdoorSkyZ + 0.35);
            this.group.add(this.sunMesh);

            // 5) Flocos de neve 2D atrás da janela (z = outdoorSkyZ + 0.48)
            const snowTex = createCanvasTexture(96, 96, function (g, w, h) {
              g.clearRect(0, 0, w, h);
              g.translate(w / 2, h / 2);
              g.strokeStyle = '#ffffff';
              g.lineWidth = 10;
              g.lineCap = 'round';
              for (let i = 0; i < 3; i++) {
                g.save();
                g.rotate((i / 3) * Math.PI);
                g.beginPath(); g.moveTo(0, -34); g.lineTo(0, 34); g.stroke();
                g.restore();
              }
            });
            const snowMat = new THREE.MeshBasicMaterial({ map: snowTex, transparent: true, depthWrite: false });
            for (let i = 0; i < 16; i++) {
              const sf = new THREE.Mesh(new THREE.PlaneGeometry(0.19, 0.19), snowMat);
              sf.userData = {
                x: winCx - 1.1 + ((i * 0.37) % 2.2),
                phase: (i * 0.29) % 1,
                speed: 0.35 + (i % 4) * 0.12,
                sway: 0.12 + (i % 3) * 0.05
              };
              sf.position.set(sf.userData.x, winCy, this.roomSpec.outdoorSkyZ + 0.48);
              sf.visible = false;
              this.group.add(sf);
              this.snowflakes.push(sf);
            }

            // 6) Partículas sutis de brilho/comemoração (6.4s - 8.0s)
            const sparkTex = createCanvasTexture(96, 96, function (g, w, h) {
              g.clearRect(0, 0, w, h);
              g.translate(w / 2, h / 2);
              g.fillStyle = '#fde047';
              g.strokeStyle = '#18181b';
              g.lineWidth = 5;
              g.beginPath();
              g.moveTo(0, -38); g.quadraticCurveTo(6, -6, 38, 0);
              g.quadraticCurveTo(6, 6, 0, 38);
              g.quadraticCurveTo(-6, 6, -38, 0);
              g.quadraticCurveTo(-6, -6, 0, -38);
              g.closePath();
              g.fill();
              g.stroke();
            });
            const sparkMat = new THREE.MeshBasicMaterial({ map: sparkTex, transparent: true, depthWrite: false });
            const sparkSeeds = [
              [-1.05, 1.55, 0.15, 0.0],
              [ 0.92, 1.72, 0.20, 0.25],
              [-0.82, 0.95, 0.25, 0.5],
              [ 0.78, 1.05, 0.15, 0.75],
              [ 0.15, 1.98, 0.22, 0.15],
              [-0.45, 1.92, 0.18, 0.62]
            ];
            for (let i = 0; i < sparkSeeds.length; i++) {
              const sp = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.24), sparkMat);
              sp.userData = { x: sparkSeeds[i][0], y: sparkSeeds[i][1], z: sparkSeeds[i][2], ph: sparkSeeds[i][3] };
              sp.position.set(sp.userData.x, sp.userData.y, sp.userData.z);
              sp.visible = false;
              this.group.add(sp);
              this.sparkles.push(sp);
            }
          }

          update(t, winterFactor) {
            const win = this.roomSpec.windowRect;
            const winCy = (win.yMin + win.yMax) / 2;

            // Termômetro troca em t = 4.15 com micro pop
            const isCold = t >= SCENE_SPEC.seasons.transitionMid;
            const wantedTex = isCold ? this.thermoColdTex : this.thermoHotTex;
            if (this.thermoMesh.material.map !== wantedTex) {
              this.thermoMesh.material.map = wantedTex;
              this.thermoMesh.material.needsUpdate = true;
            }
            const popP = invLerp(4.15, 4.45, t);
            const popScale = isCold && popP < 1 ? lerp(1.32, 1.0, easeOutCubic(popP)) : 1.0;
            this.thermoMesh.scale.setScalar(popScale);

            // Sol gira e desce suavemente quando entra o inverno
            this.sunMesh.visible = winterFactor < 0.96;
            this.sunMesh.rotation.z = t * 0.75;
            this.sunMesh.position.y = lerp(winCy + 0.26, winCy - 1.25, winterFactor);
            this.sunMesh.scale.setScalar(Math.max(0.01, 1 - winterFactor));

            // Neve caindo deterministicamente atrás da janela no inverno
            const showSnow = winterFactor > 0.12;
            for (let i = 0; i < this.snowflakes.length; i++) {
              const sf = this.snowflakes[i];
              sf.visible = showSnow;
              if (showSnow) {
                const cy = (t * sf.userData.speed + sf.userData.phase) % 1;
                sf.position.y = lerp(win.yMax + 0.55, win.yMin - 0.55, cy);
                sf.position.x = sf.userData.x + Math.sin(t * 2.5 + i) * sf.userData.sway;
                sf.rotation.z = t * 1.4 + i;
                sf.scale.setScalar(winterFactor);
              }
            }

            // Ondas de calor (1.6s -> 4.1s) vs. Ar frio (4.2s -> 8.0s)
            const heatOn = t >= 1.55 && t < 4.15;
            for (let i = 0; i < this.heatWaves.length; i++) {
              const hw = this.heatWaves[i];
              hw.visible = heatOn;
              if (heatOn) {
                const cy = (t * 1.35 + hw.userData.phase) % 1;
                hw.position.y = hw.userData.y0 + cy * 0.42;
                hw.position.x = hw.userData.x0 + Math.sin(cy * Math.PI * 2) * 0.04;
                hw.scale.setScalar(Math.max(0.01, Math.sin(cy * Math.PI)));
              }
            }

            const coldOn = t >= 4.20;
            for (let i = 0; i < this.coldStreams.length; i++) {
              const cs = this.coldStreams[i];
              cs.visible = coldOn;
              if (coldOn) {
                const cy = (t * 1.25 + cs.userData.phase) % 1;
                cs.position.y = cs.userData.y0 - cy * 0.62;
                cs.scale.setScalar(Math.max(0.01, Math.sin(cy * Math.PI)));
              }
            }

            // Balanço bem sutil da planta com a brisa
            this.plantMesh.rotation.z = Math.sin(t * 2.2) * 0.025;

            // Brilhos comemorativos (6.4s -> 8.0s)
            const celebOn = t >= 6.40;
            for (let i = 0; i < this.sparkles.length; i++) {
              const sp = this.sparkles[i];
              sp.visible = celebOn;
              if (celebOn) {
                const localT = (t - 6.40) * 1.6 + sp.userData.ph;
                const pulse = Math.sin((localT % 1) * Math.PI);
                sp.position.y = sp.userData.y + Math.sin(t * 3.0 + i) * 0.08;
                sp.rotation.z = t * 2.1 + i;
                sp.scale.setScalar(Math.max(0.01, pulse * 1.05));
              }
            }
          }
        }

        // =====================================================================
        // MÓDULO 4: PriceFlipBoard — PLACA DE PREÇO + PÍLULA + ECONOMIA (DOM)
        // =====================================================================
        class PriceFlipBoard {
          constructor(cfg) {
            this.cfg = cfg;
            this.zoneEl = document.getElementById('priceZone');
            this.pillEl = document.getElementById('conceptPill');
            this.cardEl = document.getElementById('priceCardWrapper');
            this.saveEl = document.getElementById('savingsBadge');
          }

          update(t) {
            // 1) Pílula de conceito (🔵 BAIXA PROCURA) entrando em 4.55s
            const pillP = easeOutBack(invLerp(this.cfg.pillStart, this.cfg.pillStart + 0.35, t));
            this.pillEl.style.opacity = clamp(invLerp(this.cfg.pillStart, this.cfg.pillStart + 0.18, t)).toFixed(3);
            this.pillEl.style.transform =
              'translateY(' + lerp(-10, 0, clamp(pillP, 0, 1.1)).toFixed(1) + 'px) scale(' + lerp(0.72, 1.0, clamp(pillP, 0, 1.12)).toFixed(3) + ')';

            // 2) Flip 3D da placa (4.60s -> 5.05s) + micro-shake no impacto
            const flipP = easeInOutCubic(invLerp(this.cfg.flipStart, this.cfg.flipEnd, t));
            const rotX = flipP * 180;

            // Pulso leve de escala quando preço dispara (1.8s-2.2s) e quando vira (4.6s-5.1s)
            const shockBump = Math.sin(clamp(invLerp(1.8, 2.25, t), 0, 1) * Math.PI) * 0.07;
            const flipBump  = Math.sin(clamp(invLerp(4.6, 5.15, t), 0, 1) * Math.PI) * 0.08;
            const scale = 1.0 + shockBump + flipBump;

            // Micro-shake determinístico logo ao concluir o flip (4.95s -> 5.22s)
            const shakeP = invLerp(4.95, 5.22, t);
            const shakeAmp = (shakeP > 0 && shakeP < 1) ? (1 - shakeP) * 5.0 : 0;
            const sx = Math.sin(shakeP * Math.PI * 7) * shakeAmp;
            const sy = Math.cos(shakeP * Math.PI * 5) * (shakeAmp * 0.5);

            this.cardEl.style.transform =
              'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0) rotateX(' + rotX.toFixed(1) + 'deg) scale(' + scale.toFixed(3) + ')';

            // 3) Selo verde 'ECONOMIZE R$ 1.500' em 6.40s
            const savP = easeOutBack(invLerp(this.cfg.savingsStart, this.cfg.savingsStart + 0.36, t));
            this.saveEl.style.opacity = clamp(invLerp(this.cfg.savingsStart, this.cfg.savingsStart + 0.16, t)).toFixed(3);
            this.saveEl.style.transform =
              'translateY(' + lerp(-8, 0, clamp(savP, 0, 1.1)).toFixed(1) + 'px) scale(' + lerp(0.65, 1.0, clamp(savP, 0, 1.14)).toFixed(3) + ')';
          }
        }

        // =====================================================================
        // MÓDULO 5: CameraRail25D — TRILHO DETERMINÍSTICO + ESPIAR 3D
        // =====================================================================
        class CameraRail25D {
          constructor(keys, cameraRef, mountEl) {
            this.keys = keys;
            this.camera = cameraRef;
            this.mountEl = mountEl;
            this.peekEnabled = false;
            this.dragging = false;
            this.lastX = 0;
            this.lastY = 0;
            this.peekYaw = 0;
            this.peekPitch = 0;
            this.goalYaw = 0;
            this.goalPitch = 0;
            this.posOut = new THREE.Vector3();
            this.lookOut = new THREE.Vector3();

            this.bindEvents();
          }

          bindEvents() {
            const self = this;

            this.mountEl.addEventListener('mousedown', function (e) {
              if (!self.peekEnabled) return;
              self.dragging = true;
              self.lastX = e.clientX;
              self.lastY = e.clientY;
            });
            window.addEventListener('mousemove', function (e) {
              if (!self.peekEnabled || !self.dragging) return;
              self.goalYaw   = clamp(self.goalYaw   - (e.clientX - self.lastX) * 0.0085, -1.35, 1.35);
              self.goalPitch = clamp(self.goalPitch + (e.clientY - self.lastY) * 0.0045, -0.45, 0.55);
              self.lastX = e.clientX;
              self.lastY = e.clientY;
            });
            window.addEventListener('mouseup', function () { self.dragging = false; });

            this.mountEl.addEventListener('touchstart', function (e) {
              if (!self.peekEnabled || e.touches.length !== 1) return;
              self.dragging = true;
              self.lastX = e.touches[0].clientX;
              self.lastY = e.touches[0].clientY;
            }, { passive: true });
            this.mountEl.addEventListener('touchmove', function (e) {
              if (!self.peekEnabled || !self.dragging || e.touches.length !== 1) return;
              self.goalYaw   = clamp(self.goalYaw   - (e.touches[0].clientX - self.lastX) * 0.010, -1.35, 1.35);
              self.goalPitch = clamp(self.goalPitch + (e.touches[0].clientY - self.lastY) * 0.0055, -0.45, 0.55);
              self.lastX = e.touches[0].clientX;
              self.lastY = e.touches[0].clientY;
            }, { passive: true });
            this.mountEl.addEventListener('touchend', function () { self.dragging = false; });
          }

          setPeek(on) {
            this.peekEnabled = Boolean(on);
            this.mountEl.classList.toggle('peek-active', this.peekEnabled);
            if (!this.peekEnabled) {
              this.goalYaw = 0;
              this.goalPitch = 0;
            }
          }

          sample(t, dt) {
            let a = this.keys[0];
            let b = this.keys[this.keys.length - 1];
            for (let i = 0; i < this.keys.length - 1; i++) {
              if (t >= this.keys[i].t && t <= this.keys[i + 1].t) {
                a = this.keys[i];
                b = this.keys[i + 1];
                break;
              }
            }
            const p = easeInOutCubic((t - a.t) / Math.max(0.0001, b.t - a.t));
            this.posOut.set(
              lerp(a.pos[0], b.pos[0], p),
              lerp(a.pos[1], b.pos[1], p),
              lerp(a.pos[2], b.pos[2], p)
            );
            this.lookOut.set(
              lerp(a.look[0], b.look[0], p),
              lerp(a.look[1], b.look[1], p),
              lerp(a.look[2], b.look[2], p)
            );

            // Aplica deslocamento suave do modo "Espiar 3D" sempre clamped dentro da sala
            const damp = 1 - Math.exp(-(dt || 0.016) * 9.0);
            this.peekYaw   += (this.goalYaw - this.peekYaw) * damp;
            this.peekPitch += (this.goalPitch - this.peekPitch) * damp;

            const finalX = clamp(this.posOut.x + this.peekYaw * 1.45, -2.55, 2.55);
            const finalY = clamp(this.posOut.y + this.peekPitch * 0.95, 0.85, 2.55);
            const finalZ = clamp(this.posOut.z - Math.abs(this.peekYaw) * 0.45, 3.6, 5.5);

            this.camera.position.set(finalX, finalY, finalZ);
            this.camera.lookAt(this.lookOut);
          }
        }

        // =====================================================================
        // INSTANCIAÇÃO DOS 5 MÓDULOS DA ENGINE 2.5D
        // =====================================================================
        const roomModule   = new BoxRoom3D(SCENE_SPEC.room);
        const actorModule  = new PaperActor2D(SCENE_SPEC.actor);
        const propsModule  = new SpriteProp2D(SCENE_SPEC.room);
        const priceBoard   = new PriceFlipBoard(SCENE_SPEC.priceBoard);
        const cameraRail   = new CameraRail25D(SCENE_SPEC.cameraKeys, camera, webglMount);
        const soundEngine  = new ProceduralSound25D();

        scene.add(roomModule.group, actorModule.group, propsModule.group);

        // Cores pré-alocadas para interpolação de iluminação sem lixo de memória
        const colSummerBg   = new THREE.Color(SCENE_SPEC.seasons.summer.bgColor);
        const colWinterBg   = new THREE.Color(SCENE_SPEC.seasons.winter.bgColor);
        const colSummerAmb  = new THREE.Color(SCENE_SPEC.seasons.summer.ambientColor);
        const colWinterAmb  = new THREE.Color(SCENE_SPEC.seasons.winter.ambientColor);
        const colSummerSun  = new THREE.Color(SCENE_SPEC.seasons.summer.sunColor);
        const colWinterSun  = new THREE.Color(SCENE_SPEC.seasons.winter.sunColor);
        const colWinWarm    = new THREE.Color('#fbbf24');
        const colWinCold    = new THREE.Color('#38bdf8');
        const tmpCol        = new THREE.Color();

        // =====================================================================
        // FUNÇÃO DETERMINÍSTICA CENTRAL: seek(t)
        // =====================================================================
        function updateCaptions(t) {
          let active = null;
          for (let i = 0; i < SCENE_SPEC.captions.length; i++) {
            const c = SCENE_SPEC.captions[i];
            if (t >= c.t0 && t < c.t1) {
              active = c;
              break;
            }
          }
          if (!active) {
            wordCaptionEl.style.opacity = '0';
            return;
          }
          if (wordCaptionEl.textContent !== active.text) {
            wordCaptionEl.textContent = active.text;
          }
          wordCaptionEl.style.color = active.color;

          // Pop elástico curto na entrada de cada palavra
          const localP = invLerp(active.t0, active.t0 + 0.09, t);
          const pop = lerp(0.84, 1.0, easeOutBack(localP));
          wordCaptionEl.style.opacity = '1';
          wordCaptionEl.style.transform = 'scale(' + pop.toFixed(3) + ')';
        }

        function updateSeasonEffects(t) {
          const s = SCENE_SPEC.seasons;
          const winterFactor = easeInOutCubic(invLerp(s.transitionStart, s.transitionEnd, t));

          // Interpola fundo, luz ambiente, luz direcional e luz da janela
          tmpCol.copy(colSummerBg).lerp(colWinterBg, winterFactor);
          scene.background.copy(tmpCol);

          ambientLight.color.copy(colSummerAmb).lerp(colWinterAmb, winterFactor);
          ambientLight.intensity = lerp(s.summer.ambientIntensity, s.winter.ambientIntensity, winterFactor);

          keyLight.color.copy(colSummerSun).lerp(colWinterSun, winterFactor);
          keyLight.intensity = lerp(s.summer.sunIntensity, s.winter.sunIntensity, winterFactor);

          windowBounceLight.color.copy(colWinWarm).lerp(colWinCold, winterFactor);

          // Flash suave no meio da virada (3.85s -> 4.45s)
          const flashP = invLerp(3.85, 4.45, t);
          const flashOp = (flashP > 0 && flashP < 1) ? Math.sin(flashP * Math.PI) * 0.55 : 0;
          seasonFlashEl.style.opacity = flashOp.toFixed(3);

          // Badge >> INVERNO no canto superior esquerdo (3.80s -> 4.70s)
          const badgeIn  = easeOutBack(invLerp(3.80, 4.02, t));
          const badgeOut = 1 - easeOutCubic(invLerp(4.48, 4.72, t));
          const badgeOp  = clamp(invLerp(3.80, 3.92, t)) * badgeOut;
          seasonSkipEl.style.opacity = badgeOp.toFixed(3);
          seasonSkipEl.style.transform = 'translateX(' + lerp(-14, 0, clamp(badgeIn, 0, 1.1)).toFixed(1) + 'px)';

          return winterFactor;
        }

        function renderAtTime(t, dt) {
          const winterFactor = updateSeasonEffects(t);
          roomModule.setSeasonBlend(winterFactor);
          actorModule.update(t);
          propsModule.update(t, winterFactor);
          priceBoard.update(t);
          updateCaptions(t);
          cameraRail.sample(t, dt);
          renderer.render(scene, camera);
        }

        // =====================================================================
        // CONTROLES, REDIMENSIONAMENTO E LOOP 60FPS PROTEGIDO
        // =====================================================================
        const state = {
          time: 0,
          playing: true,
          speeds: [0.5, 1.0],
          speedIdx: 1,
          scrubbing: false,
          cleanMode: false,
          lastTs: 0,
          toastTimer: null,
          cleanTimer: null
        };

        function showToast(msg) {
          toastEl.textContent = msg;
          toastEl.style.opacity = '1';
          clearTimeout(state.toastTimer);
          state.toastTimer = setTimeout(function () { toastEl.style.opacity = '0'; }, 2400);
        }

        function syncPlayUI() {
          iconPlay.classList.toggle('hidden', state.playing);
          iconPause.classList.toggle('hidden', !state.playing);
        }

        function syncSoundUI() {
          const on = soundEngine.enabled;
          iconSoundOn.classList.toggle('hidden', !on);
          iconSoundOff.classList.toggle('hidden', on);
          soundBtnLabel.textContent = on ? 'Som Ativo' : 'Ativar Som';
          soundBtn.classList.toggle('border-amber-400/50', on);
          soundBtn.classList.toggle('text-amber-200', on);
        }

        function updateScrubUI(t) {
          timeNowLabel.textContent = t.toFixed(2) + 's';
          if (!state.scrubbing) {
            scrubInput.value = String(Math.round(clamp(t / SCENE_SPEC.duration) * 800));
          }
        }

        function setCleanMode(on) {
          state.cleanMode = on;
          appShell.classList.toggle('clean-mode', on);
          if (on) {
            showToast('Modo Limpo ativo — pressione ESC ou mova o cursor para sair');
            revealExitClean();
          } else {
            exitCleanBtn.classList.remove('visible');
          }
          setTimeout(handleResize, 300);
        }

        function revealExitClean() {
          if (!state.cleanMode) return;
          exitCleanBtn.classList.add('visible');
          clearTimeout(state.cleanTimer);
          state.cleanTimer = setTimeout(function () {
            exitCleanBtn.classList.remove('visible');
          }, 2200);
        }

        function handleResize() {
          try {
            const rw = stageFrame.clientWidth;
            const rh = stageFrame.clientHeight;
            const w = rw >= 60 ? rw : 360;
            const h = rh >= 60 ? rh : 640;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
          } catch (e) {}
        }
        handleResize();
        window.addEventListener('resize', handleResize);
        if (typeof ResizeObserver !== 'undefined') {
          try { new ResizeObserver(handleResize).observe(stageFrame); } catch (e) {}
        }

        // Eventos dos controles
        playPauseBtn.addEventListener('click', function () {
          state.playing = !state.playing;
          syncPlayUI();
        });

        restartBtn.addEventListener('click', function () {
          state.time = 0;
          state.playing = true;
          soundEngine.reset(0);
          syncPlayUI();
          updateScrubUI(0);
          renderAtTime(0, 0.016);
        });

        speedBtn.addEventListener('click', function () {
          state.speedIdx = (state.speedIdx + 1) % state.speeds.length;
          speedBtn.textContent = state.speeds[state.speedIdx] + 'x';
        });

        scrubInput.addEventListener('input', function () {
          state.scrubbing = true;
          state.time = (Number(scrubInput.value) / 800) * SCENE_SPEC.duration;
          soundEngine.reset(state.time);
          timeNowLabel.textContent = state.time.toFixed(2) + 's';
          renderAtTime(state.time, 0.016);
        });
        scrubInput.addEventListener('change', function () {
          state.scrubbing = false;
        });

        soundBtn.addEventListener('click', function () {
          soundEngine.setEnabled(!soundEngine.enabled);
          if (soundEngine.enabled) {
            soundEngine.reset(state.time);
            soundEngine.playDiscountPop();
            showToast('Som procedural ativado');
          } else {
            showToast('Som silenciado');
          }
          syncSoundUI();
        });

        peekBtn.addEventListener('click', function () {
          const next = !cameraRail.peekEnabled;
          cameraRail.setPeek(next);
          peekBtn.classList.toggle('bg-sky-500/25', next);
          peekBtn.classList.toggle('border-sky-400', next);
          peekHintBadge.classList.toggle('hidden', !next);
          if (next) {
            showToast('Modo Espiar 3D ativo — arraste no palco para ver a paralaxe da sala!');
          }
        });

        cleanBtn.addEventListener('click', function () { setCleanMode(!state.cleanMode); });
        exitCleanBtn.addEventListener('click', function () { setCleanMode(false); });

        window.addEventListener('mousemove', revealExitClean);
        window.addEventListener('touchstart', revealExitClean, { passive: true });
        window.addEventListener('keydown', function (e) {
          if (e.code === 'Space') { e.preventDefault(); state.playing = !state.playing; syncPlayUI(); }
          else if (e.key === 'r' || e.key === 'R') restartBtn.click();
          else if (e.key === 'm' || e.key === 'M') soundBtn.click();
          else if (e.key === 'e' || e.key === 'E') peekBtn.click();
          else if (e.key === 'c' || e.key === 'C') setCleanMode(!state.cleanMode);
          else if (e.key === 'Escape' && state.cleanMode) setCleanMode(false);
        });

        // Loop principal a 60fps protegido em try/catch
        function animate(ts) {
          requestAnimationFrame(animate);
          try {
            if (!state.lastTs) state.lastTs = ts;
            const dt = Math.min((ts - state.lastTs) / 1000, 0.05);
            state.lastTs = ts;

            if (state.playing && !state.scrubbing) {
              state.time += dt * state.speeds[state.speedIdx];
              if (state.time >= SCENE_SPEC.duration) {
                state.time = state.time % SCENE_SPEC.duration;
                soundEngine.reset(0);
              }
              soundEngine.update(state.time);
              updateScrubUI(state.time);
            }

            renderAtTime(state.time, dt);
          } catch (err) {
            // Mantém o loop vivo sem travar silenciosamente
          }
        }

        // Inicialização imediata em loop contínuo
        syncPlayUI();
        syncSoundUI();
        updateScrubUI(0);
        renderAtTime(0, 0.016);
        hideLoadingOverlay();
        requestAnimationFrame(animate);
      }

      // =========================================================================
      // BOOTSTRAP RESILIENTE (DISPARA MESMO SE window.load JÁ OCORREU)
      // =========================================================================
      async function boot() {
        retryLoadBtn.classList.add('hidden');
        loadingSpinner.classList.remove('hidden');
        loadingTitle.textContent = 'Carregando Engine 2.5D...';

        const ok = await ensureThreeLoaded();
        if (!ok) {
          showFatalOverlay(
            'Não foi possível carregar o Three.js',
            'Verifique sua conexão com a internet e clique abaixo para tentar novamente.'
          );
          return;
        }
        try {
          startEngine25D();
        } catch (err) {
          showFatalOverlay(
            'Erro ao iniciar a cena 2.5D',
            err && err.message ? err.message : 'Falha inesperada na renderização.'
          );
        }
      }

      retryLoadBtn.addEventListener('click', boot);

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
