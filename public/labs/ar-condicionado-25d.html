<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CrieSeuVideo — Engine 2.5D Paper Diorama (Ar-Condicionado)</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 24%, #1a2234 0%, #0d121d 60%, #06090f 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f8fafc;
      user-select: none;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Container principal centralizado */
    .app-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100dvh;
      padding: 10px 12px;
      gap: 10px;
      transition: padding 0.25s ease;
    }

    .app-shell.clean-mode {
      padding: 6px;
      gap: 0;
    }

    /* Palco vertical 9:16 responsivo */
    .stage-frame {
      position: relative;
      aspect-ratio: 9 / 16;
      height: min(calc(100dvh - 118px), 840px);
      max-width: calc(100vw - 18px);
      min-width: 240px;
      min-height: 426px;
      width: auto;
      border-radius: 26px;
      overflow: hidden;
      background: #2b241d;
      box-shadow:
        0 26px 72px rgba(0, 0, 0, 0.72),
        0 0 0 1.5px rgba(255, 255, 255, 0.14);
      transition: height 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .app-shell.clean-mode .stage-frame {
      height: min(calc(100dvh - 14px), 930px);
    }

    @media (max-aspect-ratio: 9/17) {
      .stage-frame {
        width: calc(100vw - 14px);
        height: auto;
        max-height: calc(100dvh - 122px);
      }
      .app-shell.clean-mode .stage-frame {
        width: calc(100vw - 10px);
        max-height: calc(100dvh - 14px);
      }
    }

    #webglMount {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #webglMount.peek-active {
      cursor: grab;
    }

    #webglMount.peek-active:active {
      cursor: grabbing;
    }

    #webglMount canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Flash suave da virada de estação */
    #seasonFlash {
      position: absolute;
      inset: 0;
      z-index: 24;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, rgba(224, 242, 254, 0.92) 0%, rgba(186, 230, 253, 0.65) 100%);
      opacity: 0;
      will-change: opacity;
    }

    /* Badge de avanço de estação (>> INVERNO) */
    .season-skip-badge {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #38bdf8;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.42);
      will-change: transform, opacity;
    }

    /* PriceFlipBoard: Safe Area Superior com perspectiva 3D CSS */
    .price-zone {
      position: absolute;
      top: 4.2%;
      left: 50%;
      transform: translateX(-50%);
      width: 86%;
      max-width: 318px;
      z-index: 22;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      perspective: 900px;
    }

    .concept-pill {
      background: #ffffff;
      color: #0f172a;
      border: 2.5px solid #18181b;
      box-shadow: 0 4px 0 #18181b, 0 8px 18px rgba(0, 0, 0, 0.28);
      will-change: transform, opacity;
    }

    .price-card-wrapper {
      width: 100%;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .price-card-face {
      width: 100%;
      border-radius: 16px;
      border: 3px solid #18181b;
      box-shadow: 0 5px 0 #18181b, 0 12px 26px rgba(0, 0, 0, 0.34);
      padding: 8px 14px;
      text-align: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .price-card-expensive {
      background: #ffffff;
    }

    .price-card-discount {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #fde047 0%, #facc15 100%);
      transform: rotateX(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .strike-price {
      position: relative;
      display: inline-block;
      color: #dc2626;
      font-weight: 800;
      font-size: 13px;
      line-height: 1;
    }

    .strike-price::after {
      content: '';
      position: absolute;
      left: -4px;
      right: -4px;
      top: 50%;
      height: 2.5px;
      background: #dc2626;
      transform: rotate(-6deg);
      border-radius: 2px;
    }

    .savings-badge {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      color: #ffffff;
      border: 2.5px solid #18181b;
      box-shadow: 0 4px 0 #18181b, 0 10px 20px rgba(0, 0, 0, 0.3);
      will-change: transform, opacity;
    }

    /* Legenda 1 palavra por vez estilo @dinheirofalante na faixa inferior segura */
    .caption-zone {
      position: absolute;
      bottom: 6.2%;
      left: 0;
      right: 0;
      z-index: 25;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 14px;
      pointer-events: none;
    }

    .word-caption {
      font-weight: 900;
      font-size: clamp(26px, 6.2vw, 38px);
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #ffffff;
      -webkit-text-stroke: 2px #111114;
      paint-order: stroke fill;
      text-shadow:
        -3px -3px 0 #111114,
         3px -3px 0 #111114,
        -3px  3px 0 #111114,
         3px  3px 0 #111114,
         0px  5px 0 #111114,
         0px 10px 18px rgba(0, 0, 0, 0.62);
      will-change: transform, opacity;
      text-align: center;
    }

    /* Barra de controles externa */
    .control-dock {
      background: rgba(15, 22, 34, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.48);
      width: min(520px, calc(100vw - 14px));
      transition: opacity 0.22s ease, transform 0.22s ease, max-height 0.22s ease;
    }

    .app-shell.clean-mode .control-dock {
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px);
      max-height: 0;
      padding: 0;
      border-width: 0;
      overflow: hidden;
    }

    .exit-clean-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .app-shell.clean-mode .exit-clean-btn.visible {
      opacity: 0.95;
      pointer-events: auto;
    }

    /* Range scrubber estilizado */
    input[type="range"].scrub-input {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(148, 163, 184, 0.26);
      height: 7px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].scrub-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: #facc15;
      border: 2.5px solid #0f172a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="appShell" class="app-shell">
    <!-- Botão discreto para sair do Modo Limpo -->
    <button id="exitCleanBtn" type="button"
      class="exit-clean-btn px-3.5 py-1.5 rounded-full bg-slate-900/92 hover:bg-slate-800 border border-slate-600/70 text-xs font-bold text-slate-100 backdrop-blur-md shadow-xl cursor-pointer">
      Sair do Modo Limpo (ESC)
    </button>

    <!-- =================================================================== -->
    <!-- PALCO VERTICAL 9:16                                                 -->
    <!-- =================================================================== -->
    <main id="stageFrame" class="stage-frame">
      <!-- WebGL Three.js Canvas -->
      <div id="webglMount"></div>

      <!-- Flash suave da virada de estação -->
      <div id="seasonFlash"></div>

      <!-- Badge de transição de estação no topo esquerdo (>> INVERNO) -->
      <div id="seasonSkipBadge"
        class="season-skip-badge absolute top-3.5 left-3.5 z-30 px-3 py-1 rounded-full flex items-center gap-1.5 text-[11px] font-black tracking-wider text-sky-300 opacity-0 pointer-events-none">
        <span class="text-white">&raquo;</span>
        <span>INVERNO</span>
      </div>

      <!-- Aviso quando o modo "Espiar 3D" está ativo -->
      <div id="peekHintBadge"
        class="hidden absolute top-3.5 right-3.5 z-30 px-2.5 py-1 rounded-full bg-sky-500/90 border border-white/40 text-slate-950 text-[10px] font-black uppercase tracking-wide shadow-lg pointer-events-none">
        Arraste 3D
      </div>

      <!-- MÓDULO 4: PriceFlipBoard (Safe Area Superior — zero clipping) -->
      <div id="priceZone" class="price-zone">
        <!-- Pílula de conceito (🔵 BAIXA PROCURA) -->
        <div id="conceptPill"
          class="concept-pill mb-1.5 px-3 py-0.5 rounded-full inline-flex items-center gap-1.5 text-[10.5px] font-black uppercase tracking-wider opacity-0">
          <span class="w-2.5 h-2.5 rounded-full bg-sky-500 border border-slate-900 inline-block"></span>
          <span>BAIXA PROCURA</span>
        </div>

        <!-- Placa de Preço com Flip 3D -->
        <div id="priceCardWrapper" class="price-card-wrapper">
          <!-- Face 1: Caro (Branco) -->
          <div class="price-card-face price-card-expensive">
            <div class="text-[9.5px] font-extrabold uppercase tracking-[0.14em] text-slate-500 leading-none">
              AR-CONDICIONADO SPLIT
            </div>
            <div class="tabular-nums text-[28px] sm:text-[31px] font-black text-red-600 leading-tight mt-0.5 tracking-tight">
              R$ 3.999
            </div>
          </div>

          <!-- Face 2: Desconto (Amarelo) -->
          <div class="price-card-face price-card-discount">
            <div class="strike-price tabular-nums">R$ 3.999</div>
            <div class="tabular-nums text-[29px] sm:text-[32px] font-black text-emerald-700 leading-none mt-0.5 tracking-tight">
              R$ 2.499
            </div>
          </div>
        </div>

        <!-- Selo de Economia (6.4s - 8.0s) -->
        <div id="savingsBadge"
          class="savings-badge mt-1.5 px-3.5 py-1 rounded-full text-[11.5px] font-black uppercase tracking-wide opacity-0">
          ECONOMIZE R$ 1.500
        </div>
      </div>

      <!-- Legenda 1 palavra por vez na faixa inferior segura -->
      <div class="caption-zone">
        <div id="wordCaption" class="word-caption">NO</div>
      </div>

      <!-- Overlay de carregamento (oculta automaticamente ao iniciar) -->
      <div id="loadingOverlay"
        class="absolute inset-0 z-40 flex flex-col items-center justify-center px-6 text-center bg-slate-950/92 backdrop-blur-md transition-opacity duration-300">
        <div id="loadingSpinner" class="w-9 h-9 rounded-full border-4 border-amber-400/25 border-t-amber-400 animate-spin mb-3"></div>
        <div id="loadingTitle" class="text-sm font-extrabold text-white">Carregando Engine 2.5D...</div>
        <div id="loadingDetail" class="mt-1 text-xs text-slate-300 max-w-[230px]">
          Preparando Three.js r128 e cena Paper Diorama.
        </div>
        <button id="retryLoadBtn" type="button"
          class="hidden mt-4 px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-xs cursor-pointer">
          Tentar Novamente
        </button>
      </div>
    </main>

    <!-- =================================================================== -->
    <!-- BARRA DE CONTROLES COMPACTA FORA DO PALCO                           -->
    <!-- =================================================================== -->
    <nav id="controlDock" aria-label="Controles do Protótipo 2.5D"
      class="control-dock rounded-2xl px-3 py-2.5 flex flex-col gap-2">
      <!-- Linha 1: Scrubber determinístico (0.00s a 8.00s) -->
      <div class="flex items-center gap-2.5">
        <span id="timeNowLabel" class="tabular-nums text-[11px] font-extrabold text-amber-300 min-w-[38px]">0.00s</span>
        <input id="scrubInput" type="range" min="0" max="800" value="0" class="scrub-input flex-1"
          aria-label="Scrubber determinístico da cena (0 a 8 segundos)" />
        <span class="tabular-nums text-[11px] font-bold text-slate-400 min-w-[38px] text-right">8.00s</span>
      </div>

      <!-- Linha 2: Botões principais -->
      <div class="flex flex-wrap items-center justify-between gap-1.5">
        <div class="flex items-center gap-1.5">
          <!-- Play / Pause -->
          <button id="playPauseBtn" type="button" title="Play / Pause (Espaço)"
            class="p-2 rounded-xl bg-amber-400/20 hover:bg-amber-400/30 border border-amber-400/45 text-amber-300 transition active:scale-95 cursor-pointer">
            <svg id="iconPlay" class="w-4 h-4 fill-current hidden" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
            <svg id="iconPause" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
          </button>

          <!-- Reiniciar -->
          <button id="restartBtn" type="button" title="Reiniciar (R)"
            class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 transition active:scale-95 cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>

          <!-- Velocidade (0.5x / 1x) -->
          <button id="speedBtn" type="button" title="Alternar velocidade (0.5x / 1x)"
            class="px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-[11px] font-extrabold tabular-nums min-w-[44px] transition active:scale-95 cursor-pointer">
            1x
          </button>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Ativar Som -->
          <button id="soundBtn" type="button" title="Ativar / Silenciar Som Procedural (M)"
            class="px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-[11px] font-bold flex items-center gap-1.5 transition active:scale-95 cursor-pointer">
            <svg id="iconSoundOn" class="w-3.5 h-3.5 text-amber-300 hidden" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.54 8.46a5 5 0 010 7.07" />
            </svg>
            <svg id="iconSoundOff" class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11 5L6 9H2v6h4l5 4V5z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M23 9l-6 6M17 9l6 6" />
            </svg>
            <span id="soundBtnLabel" class="hidden sm:inline">Ativar Som</span>
          </button>

          <!-- Espiar 3D (Arrastar) -->
          <button id="peekBtn" type="button" title="Espiar 3D — Arraste para comprovar a paralaxe real (E)"
            class="px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sky-300 text-[11px] font-bold flex items-center gap-1 transition active:scale-95 cursor-pointer">
            <span>Espiar 3D</span>
          </button>

          <!-- Modo Limpo -->
          <button id="cleanBtn" type="button" title="Modo Limpo para gravação 9:16 (C)"
            class="px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-[11px] font-bold transition active:scale-95 cursor-pointer">
            Limpo
          </button>
        </div>
      </div>
    </nav>
  </div>

  <!-- Toast discreto (substitui alert/confirm) -->
  <div id="toastEl"
    class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-slate-900/95 border border-slate-600/70 text-xs font-bold text-slate-100 shadow-2xl backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
    Aviso
  </div>

  <script>
    /**
     * ============================================================================
     * CRIESEUVIDEO — ENGINE 2.5D "PAPER DIORAMA" (PROVA DE CONCEITO: AR-CONDICIONADO)
     * ----------------------------------------------------------------------------
     * Arquitetura Modular Declarativa em 5 Módulos Reutilizáveis:
     *   0. SCENE_SPEC       : Roteiro declarativo (duração, sala, ator, props,
     *                         placa de preço, trilho de câmera e legendas).
     *   1. BoxRoom3D        : Sala 3D real com abertura real de janela, moldura
     *                         em relevo, móveis low-poly e folgas físicas >= 0.05.
     *   2. PaperActor2D     : Personagem plano 2D (Nota R$ 100) com contorno preto,
     *                         4 expressões trocáveis, braços/pernas articulados e
     *                         sombra oval de contato.
     *   3. SpriteProp2D     : Props 2D recortados em diferentes profundidades Z
     *                         (ar-condicionado split, planta, termômetro 40°C/12°C,
     *                         sol, neve, suor e partículas de brilho).
     *   4. PriceFlipBoard   : Placa de preço + pílula + badge na safe area superior.
     *   5. CameraRail25D    : Trilho de câmera 100% determinístico + modo Espiar 3D.
     * ============================================================================
     */
    (function () {
      'use strict';

      // =========================================================================
      // 0. SCENE_SPEC — CONTRATO DECLARATIVO DA CENA (8.00 SEGUNDOS)
      // =========================================================================
      const SCENE_SPEC = {
        id: 'ar_condicionado_verao_inverno_v1',
        duration: 8.0,

        room: {
          width: 7.4,
          height: 4.6,
          depth: 7.2,
          backWallZ: -2.8,
          // Abertura REAL na parede traseira (zero z-fighting)
          windowRect: { xMin: -2.15, xMax: -0.25, yMin: 1.25, yMax: 2.65 },
          outdoorSkyZ: -4.25
        },

        seasons: {
          transitionStart: 3.85,
          transitionMid: 4.15,
          transitionEnd: 4.55,
          summer: {
            bgColor: '#f5cfa0',
            ambientColor: '#ffedd5',
            ambientIntensity: 0.92,
            sunColor: '#fff2cc',
            sunIntensity: 0.78,
            skyTop: '#f59e0b',
            skyBottom: '#fef08a'
          },
          winter: {
            bgColor: '#7cb5d9',
            ambientColor: '#dbeafe',
            ambientIntensity: 0.94,
            sunColor: '#bae6fd',
            sunIntensity: 0.72,
            skyTop: '#1d4ed8',
            skyBottom: '#bae6fd'
          }
        },

        actor: {
          basePos: { x: -0.18, y: 0.0, z: -0.35 },
          cues: [
            { t0: 0.0, t1: 1.8, expression: 'worried_sweating', pose: 'worried_wave' },
            { t0: 1.8, t1: 4.6, expression: 'shocked',          pose: 'shocked_up' },
            { t0: 4.6, t1: 6.4, expression: 'smug',             pose: 'point_up' },
            { t0: 6.4, t1: 8.0, expression: 'happy',            pose: 'celebrate' }
          ]
        },

        priceBoard: {
          flipStart: 4.60,
          flipEnd: 5.05,
          pillStart: 4.55,
          savingsStart: 6.40
        },

        // Keyframes determinísticos do trilho de câmera (sempre dentro da sala!)
        cameraKeys: [
          { t: 0.0, pos: [-0.52, 1.48, 5.25], look: [-0.08, 1.32, -0.5] },
          { t: 1.8, pos: [-0.15, 1.50, 5.05], look: [-0.05, 1.34, -0.5] },
          { t: 3.8, pos: [ 0.28, 1.54, 4.55], look: [ 0.02, 1.40, -0.6] },
          { t: 4.6, pos: [-0.25, 1.52, 4.82], look: [-0.02, 1.36, -0.5] },
          { t: 6.4, pos: [ 0.36, 1.49, 4.92], look: [ 0.00, 1.32, -0.5] },
          { t: 8.0, pos: [-0.30, 1.50, 5.18], look: [-0.05, 1.32, -0.5] }
        ],

        // Legendas 1 palavra por vez sincronizadas com os 5 atos
        captions: [
          // 0.0s - 1.8s: Verão 40°C
          { t0: 0.00, t1: 0.28, text: 'NO',        color: '#ffffff' },
          { t0: 0.28, t1: 0.62, text: 'VERÃO',     color: '#fde047' },
          { t0: 0.62, t1: 0.90, text: 'TODO',      color: '#ffffff' },
          { t0: 0.90, t1: 1.18, text: 'MUNDO',     color: '#ffffff' },
          { t0: 1.18, t1: 1.46, text: 'QUER',      color: '#ffffff' },
          { t0: 1.46, t1: 1.80, text: 'AR...',     color: '#fde047' },

          // 1.8s - 3.8s: Preço nas alturas
          { t0: 1.80, t1: 2.06, text: 'E',         color: '#ffffff' },
          { t0: 2.06, t1: 2.32, text: 'O',         color: '#ffffff' },
          { t0: 2.32, t1: 2.72, text: 'PREÇO',     color: '#ffffff' },
          { t0: 2.72, t1: 3.18, text: 'DISPARA:',  color: '#fca5a5' },
          { t0: 3.18, t1: 3.80, text: 'R$ 3.999!', color: '#f87171' },

          // 3.8s - 4.6s: Respiro visual da virada (>> INVERNO assume o foco)

          // 4.6s - 6.4s: Baixa procura
          { t0: 4.60, t1: 4.88, text: 'NO',        color: '#ffffff' },
          { t0: 4.88, t1: 5.22, text: 'FRIO,',     color: '#7dd3fc' },

      // =========================================================================
      // UTILITÁRIOS MATEMÁTICOS DETERMINÍSTICOS
      // =========================================================================
      function clamp(v, min, max) {
        if (min === undefined) min = 0;
        if (max === undefined) max = 1;
        return Math.max(min, Math.min(max, v));
      }
      function lerp(a, b, t) { return a + (b - a) * t; }
      function invLerp(a, b, v) { return clamp((v - a) / (b - a), 0, 1); }
      function easeOutCubic(t) { t = clamp(t); return 1 - Math.pow(1 - t, 3); }
      function easeInOutCubic(t) {
        t = clamp(t);
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }
      function easeOutBack(t) {
        t = clamp(t);
        const c1 = 1.65;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }

      function drawRoundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      // =========================================================================
      const THREE_CDNS = [
        { name: 'CDNJS',    url: 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js' },
        { name: 'jsDelivr', url: 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js' },

      function loadScript(url, timeoutMs) {
        return new Promise(function (resolve, reject) {
          const s = document.createElement('script');
          s.src = url;
          s.async = true;
          let done = false;

          const timer = setTimeout(function () {
            if (done) return;
            done = true;
            try { s.remove(); } catch (e) {}
            reject(new Error('Timeout'));
          }, timeoutMs);

          s.onload = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            if (window.THREE && typeof window.THREE.WebGLRenderer === 'function') resolve();
            else {
              try { s.remove(); } catch (e) {}
              reject(new Error('THREE inválido'));
            }
          };

          s.onerror = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            try { s.remove(); } catch (e) {}
            reject(new Error('Erro de rede'));
          };

          document.head.appendChild(s);
        });
      }

      async function ensureThreeLoaded() {
        if (window.THREE && typeof window.THREE.WebGLRenderer === 'function') return true;
        for (let i = 0; i < THREE_CDNS.length; i++) {
          loadingDetail.textContent = 'Baixando Three.js r128 (' + THREE_CDNS[i].name + ')...';
          try {
            await loadScript(THREE_CDNS[i].url, 8000);
            if (window.THREE && typeof window.THREE.WebGLRenderer === 'function') return true;
          } catch (e) {
            // Próximo CDN
          }
        }
        return false;
      }

      // =========================================================================
      // MOTOR DE ÁUDIO PROCEDURAL BLINDADO (WEB AUDIO API EM TRY/CATCH)
      // =========================================================================
      class ProceduralSound25D {
        constructor() {
          this.ctx = null;
          this.master = null;
          this.enabled = false;
          this.fired = new Set();
        }

        setEnabled(on) {
          try {
            if (on) {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return false;
              if (!this.ctx) {
                this.ctx = new AC();
                this.master = this.ctx.createGain();
                this.master.gain.value = 0.32;
                this.master.connect(this.ctx.destination);
              }
              if (this.ctx.state === 'suspended') {
                const p = this.ctx.resume();
                if (p && typeof p.catch === 'function') p.catch(function () {});
              }
              this.enabled = true;
              this.master.gain.setTargetAtTime(0.32, this.ctx.currentTime, 0.04);
              return true;
            }
            this.enabled = false;
            if (this.master && this.ctx) {
              this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.04);
            }
            return false;
          } catch (e) {
            this.enabled = false;
            return false;
          }
        }

        canPlay() {
          try { return Boolean(this.enabled && this.ctx && this.ctx.state === 'running'); }
          catch (e) { return false; }
        }

        reset(fromTime) {
          this.fired.clear();
          const t0 = fromTime || 0;
          for (let i = 0; i < AUDIO_CUES.length; i++) {
            if (AUDIO_CUES[i].t < t0 - 0.08) this.fired.add(AUDIO_CUES[i].id);
          }
        }

        noiseBuffer(dur) {
          const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
          const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          return buf;
        }

        playHeatShimmer() {
          if (!this.canPlay()) return;
          try {
            const now = this.ctx.currentTime;
            const n = this.ctx.createBufferSource();
            n.buffer = this.noiseBuffer(0.95);
            const bp = this.ctx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.setValueAtTime(520, now);
            bp.frequency.linearRampToValueAtTime(340, now + 0.95);
            bp.Q.value = 1.6;
            const g = this.ctx.createGain();
            g.gain.setValueAtTime(0.001, now);
            g.gain.linearRampToValueAtTime(0.09, now + 0.25);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
            n.connect(bp); bp.connect(g); g.connect(this.master);
            n.start(now);
          } catch (e) {}
        }

        playShockBleep() {
          if (!this.canPlay()) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(310, now);
            osc.frequency.exponentialRampToValueAtTime(620, now + 0.14);
            g.gain.setValueAtTime(0.16, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(g); g.connect(this.master);
            osc.start(now); osc.stop(now + 0.24);
          } catch (e) {}
        }

        playWinterWhoosh() {
          if (!this.canPlay()) return;
          try {
            const now = this.ctx.currentTime;
            const n = this.ctx.createBufferSource();
            n.buffer = this.noiseBuffer(0.85);
            const flt = this.ctx.createBiquadFilter();
            flt.type = 'bandpass';
            flt.frequency.setValueAtTime(260, now);
            flt.frequency.exponentialRampToValueAtTime(2100, now + 0.35);
            flt.frequency.exponentialRampToValueAtTime(620, now + 0.82);
            flt.Q.value = 2.4;
            const g = this.ctx.createGain();
            g.gain.setValueAtTime(0.001, now);
            g.gain.linearRampToValueAtTime(0.24, now + 0.25);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
            n.connect(flt); flt.connect(g); g.connect(this.master);
            n.start(now);
          } catch (e) {}
        }

        playDiscountPop() {
          if (!this.canPlay()) return;
          try {
            const now = this.ctx.currentTime;
            const notes = [523.25, 783.99, 1046.5];
            for (let i = 0; i < notes.length; i++) {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = i === 0 ? 'triangle' : 'sine';
              const st = now + i * 0.055;
              osc.frequency.setValueAtTime(notes[i], st);
              g.gain.setValueAtTime(0.001, st);
              g.gain.linearRampToValueAtTime(0.16, st + 0.015);
              g.gain.exponentialRampToValueAtTime(0.001, st + 0.24);
              osc.connect(g); g.connect(this.master);
              osc.start(st); osc.stop(st + 0.26);
            }
          } catch (e) {}
        }

        playCelebrateChord() {
          if (!this.canPlay()) return;
          try {
            const now = this.ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.5];
            for (let i = 0; i < notes.length; i++) {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'sine';
              const st = now + i * 0.045;
              osc.frequency.setValueAtTime(notes[i], st);
              g.gain.setValueAtTime(0.001, st);
              g.gain.linearRampToValueAtTime(0.11, st + 0.03);
              g.gain.exponentialRampToValueAtTime(0.001, st + 0.65);
              osc.connect(g); g.connect(this.master);
              osc.start(st); osc.stop(st + 0.7);
            }
          } catch (e) {}
        }

        update(t) {
          if (!this.canPlay()) return;
          for (let i = 0; i < AUDIO_CUES.length; i++) {
            const cue = AUDIO_CUES[i];
            if (!this.fired.has(cue.id) && t >= cue.t && t < cue.t + 0.22) {
              this.fired.add(cue.id);
              cue.fn(this);
            }
          }
        }
      }

        // Helper de textura Canvas 2D
        function createCanvasTexture(w, h, drawFn, repeatX, repeatY) {
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const ctx = c.getContext('2d');
          if (ctx) drawFn(ctx, w, h);
          const tex = new THREE.CanvasTexture(c);
          tex.encoding = THREE.sRGBEncoding;
          if (repeatX || repeatY) {
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(repeatX || 1, repeatY || 1);
          }
          tex.needsUpdate = true;
          return tex;
        }

        // =====================================================================
        // MÓDULO 1: BoxRoom3D — SALA 3D COM JANELA REAL E MÓVEIS LOW-POLY
        // =====================================================================
        class BoxRoom3D {
          constructor(spec) {
            this.group = new THREE.Group();
            this.group.name = 'BoxRoom3D';
            this.spec = spec;
            this.summerSkyMat = null;
            this.winterSkyMat = null;
            this.build();
          }

          build() {
            const W = this.spec.width;
            const H = this.spec.height;
            const D = this.spec.depth;
            const bz = this.spec.backWallZ;
            const win = this.spec.windowRect;

            // Textura procedural de piso de tábuas de madeira aconchegante
            const woodTex = createCanvasTexture(512, 512, function (g, w, h) {
              g.fillStyle = '#a47148';
              g.fillRect(0, 0, w, h);
              const rows = 8;
              const rh = h / rows;
              const shades = ['#a47148', '#99663f', '#ae7b52', '#8f5e39'];
              for (let r = 0; r < rows; r++) {
                const offset = (r % 2) * 140;
                for (let c = -1; c <= 2; c++) {
                  const px = c * 256 + offset;
                  g.fillStyle = shades[(r * 3 + c + 4) % shades.length];
                  g.fillRect(px + 2, r * rh + 2, 252, rh - 4);
                  // Veio sutil
                  g.fillStyle = 'rgba(60, 32, 12, 0.08)';
                  g.fillRect(px + 8, r * rh + rh * 0.32, 240, 3);
                  g.fillRect(px + 14, r * rh + rh * 0.68, 224, 2);
                }
                // Junta escura entre tábuas
                g.fillStyle = '#6f482b';
                g.fillRect(0, r * rh, w, 3);
              }
            }, 3, 3);

            // Textura procedural de papel de parede cartoon retrô (estilo @dinheirofalante)
            const wallTex = createCanvasTexture(256, 256, function (g, w, h) {
              g.fillStyle = '#c8b498';
              g.fillRect(0, 0, w, h);
              // Listras verticais sutis
              g.fillStyle = 'rgba(255, 248, 235, 0.14)';
              for (let x = 0; x < w; x += 32) {
                g.fillRect(x, 0, 14, h);
              }
              // Padrão geométrico bem discreto
              g.strokeStyle = 'rgba(110, 88, 64, 0.14)';
              g.lineWidth = 2;
              for (let y = 32; y < h; y += 64) {
                for (let x = 32; x < w; x += 64) {
                  g.beginPath();
                  g.arc(x, y, 8, 0, Math.PI * 2);
                  g.stroke();
                }
              }
            }, 4, 3);

            const floorMat = new THREE.MeshLambertMaterial({ map: woodTex });
            const wallMat = new THREE.MeshLambertMaterial({ map: wallTex });
            const ceilMat = new THREE.MeshLambertMaterial({ color: '#e6dccb' });
            const trimMat = new THREE.MeshLambertMaterial({ color: '#5c3d28' });
            const frameMat = new THREE.MeshLambertMaterial({ color: '#3b2618' });

            // 1) Piso (topo exato em y = 0.00)
            const floor = new THREE.Mesh(new THREE.BoxGeometry(W + 0.4, 0.2, D + 2.0), floorMat);
            floor.position.set(0, -0.10, bz + D / 2 + 0.6);
            floor.receiveShadow = true;
            this.group.add(floor);

            // 2) Teto (base em y = H)
            const ceiling = new THREE.Mesh(new THREE.BoxGeometry(W + 0.4, 0.2, D + 2.0), ceilMat);
            ceiling.position.set(0, H + 0.10, bz + D / 2 + 0.6);
            this.group.add(ceiling);

            // 3) Paredes Laterais (com folga real fora da parede traseira)
            const wallT = 0.24;
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallT, H, D + 2.0), wallMat);
            leftWall.position.set(-W / 2 - wallT / 2, H / 2, bz + D / 2 + 0.6);
            leftWall.receiveShadow = true;
            this.group.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallT, H, D + 2.0), wallMat);
            rightWall.position.set(W / 2 + wallT / 2, H / 2, bz + D / 2 + 0.6);
            rightWall.receiveShadow = true;
            this.group.add(rightWall);

            // 4) Parede Traseira construída em 4 blocos ao redor da ABERTURA REAL DA JANELA
            const backCenterZ = bz - wallT / 2;
            const leftSecW = win.xMin - (-W / 2);
            const rightSecW = (W / 2) - win.xMax;
            const winW = win.xMax - win.xMin;
            const winH = win.yMax - win.yMin;
            const botSecH = win.yMin;
            const topSecH = H - win.yMax;

            const backLeft = new THREE.Mesh(new THREE.BoxGeometry(leftSecW, H, wallT), wallMat);
            backLeft.position.set(-W / 2 + leftSecW / 2, H / 2, backCenterZ);
            backLeft.receiveShadow = true;

            const backRight = new THREE.Mesh(new THREE.BoxGeometry(rightSecW, H, wallT), wallMat);
            backRight.position.set(win.xMax + rightSecW / 2, H / 2, backCenterZ);
            backRight.receiveShadow = true;

            const backBottom = new THREE.Mesh(new THREE.BoxGeometry(winW, botSecH, wallT), wallMat);
            backBottom.position.set((win.xMin + win.xMax) / 2, botSecH / 2, backCenterZ);
            backBottom.receiveShadow = true;

            const backTop = new THREE.Mesh(new THREE.BoxGeometry(winW, topSecH, wallT), wallMat);
            backTop.position.set((win.xMin + win.xMax) / 2, win.yMax + topSecH / 2, backCenterZ);
            backTop.receiveShadow = true;

            this.group.add(backLeft, backRight, backBottom, backTop);

            // 5) Rodapés em relevo (folga 0.05 para zero z-fighting)
            const baseH = 0.22;
            const baseD = 0.08;
            const baseBack = new THREE.Mesh(new THREE.BoxGeometry(W, baseH, baseD), trimMat);
            baseBack.position.set(0, baseH / 2, bz + baseD / 2);
            const baseLeft = new THREE.Mesh(new THREE.BoxGeometry(baseD, baseH, D + 1.5), trimMat);
            baseLeft.position.set(-W / 2 + baseD / 2, baseH / 2, bz + D / 2 + 0.5);
            const baseRight = baseLeft.clone();
            baseRight.position.x = W / 2 - baseD / 2;
            this.group.add(baseBack, baseLeft, baseRight);

            // 6) Moldura 3D da Janela em relevo + parapeito
            const fThick = 0.11;
            const fDepth = 0.34;
            const winCx = (win.xMin + win.xMax) / 2;
            const winCy = (win.yMin + win.yMax) / 2;

            const fTop = new THREE.Mesh(new THREE.BoxGeometry(winW + fThick * 2, fThick, fDepth), frameMat);
            fTop.position.set(winCx, win.yMax + fThick / 2 - 0.02, backCenterZ + 0.03);
            const fBot = new THREE.Mesh(new THREE.BoxGeometry(winW + fThick * 2 + 0.14, fThick + 0.03, fDepth + 0.12), frameMat);
            fBot.position.set(winCx, win.yMin - fThick / 2 + 0.02, backCenterZ + 0.08);
            const fLeft = new THREE.Mesh(new THREE.BoxGeometry(fThick, winH, fDepth), frameMat);
            fLeft.position.set(win.xMin - fThick / 2 + 0.02, winCy, backCenterZ + 0.03);
            const fRight = new THREE.Mesh(new THREE.BoxGeometry(fThick, winH, fDepth), frameMat);
            fRight.position.set(win.xMax + fThick / 2 - 0.02, winCy, backCenterZ + 0.03);

            // Cruz central fina da janela
            const barH = new THREE.Mesh(new THREE.BoxGeometry(winW, 0.055, 0.06), frameMat);
            barH.position.set(winCx, winCy, bz - 0.08);
            const barV = new THREE.Mesh(new THREE.BoxGeometry(0.055, winH, 0.06), frameMat);
            barV.position.set(winCx, winCy, bz - 0.08);

            // Vidro translúcido discreto
            const glass = new THREE.Mesh(
              new THREE.PlaneGeometry(winW, winH),
              new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.10 })
            );
            glass.position.set(winCx, winCy, bz - 0.13);

            this.group.add(fTop, fBot, fLeft, fRight, barH, barV, glass);

            // 7) Fundo Externo atrás da janela (2 planos com folga >= 0.08 para transição limpa)
            const summerSkyTex = createCanvasTexture(256, 256, function (g, w, h) {
              const gr = g.createLinearGradient(0, 0, 0, h);
              gr.addColorStop(0, '#f97316');
              gr.addColorStop(0.55, '#fbbf24');
              gr.addColorStop(1, '#fef08a');
              g.fillStyle = gr;
              g.fillRect(0, 0, w, h);
            });
            const winterSkyTex = createCanvasTexture(256, 256, function (g, w, h) {
              const gr = g.createLinearGradient(0, 0, 0, h);
              gr.addColorStop(0, '#1e3a8a');
              gr.addColorStop(0.55, '#3b82f6');
              gr.addColorStop(1, '#bae6fd');
              g.fillStyle = gr;
              g.fillRect(0, 0, w, h);
            });

            this.summerSkyMat = new THREE.MeshBasicMaterial({ map: summerSkyTex });
            this.winterSkyMat = new THREE.MeshBasicMaterial({ map: winterSkyTex, transparent: true, opacity: 0 });

            const skyW = 5.4;
            const skyH = 4.2;
            const skySummer = new THREE.Mesh(new THREE.PlaneGeometry(skyW, skyH), this.summerSkyMat);
            skySummer.position.set(winCx, winCy, this.spec.outdoorSkyZ - 0.08);
            const skyWinter = new THREE.Mesh(new THREE.PlaneGeometry(skyW, skyH), this.winterSkyMat);
            skyWinter.position.set(winCx, winCy, this.spec.outdoorSkyZ);
            this.group.add(skySummer, skyWinter);

            // 8) Móveis 3D Low-Poly para dar Paralaxe Real de Profundidade Z
            this.buildFurniture();
          }

          buildFurniture() {
            // Sofá 3D estilizado (plano médio-fundo à direita: x = +1.35, z = -1.78)
            const sofa = new THREE.Group();
            const couchMat = new THREE.MeshLambertMaterial({ color: '#8c5332' });

            const base = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.42, 0.92), couchMat);
            base.position.set(0, 0.33, 0);
            base.castShadow = true; base.receiveShadow = true;

            const back = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.68, 0.24), couchMat);
            back.position.set(0, 0.78, -0.34);
            back.castShadow = true;

            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.56, 0.94), couchMat);
            armL.position.set(-0.96, 0.52, 0);

            const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.16, 0.70), cushionMat);

            const legPos = [[-0.88, -0.34], [0.88, -0.34], [-0.88, 0.34], [0.88, 0.34]];
            for (let i = 0; i < legPos.length; i++) {

              leg.position.set(legPos[i][0], 0.07, legPos[i][1]);
              sofa.add(leg);
            }
            sofa.add(base, back, armL, armR, c1, c2);
            sofa.position.set(1.38, 0.0, -1.78);
            this.group.add(sofa);

            // Mesinha lateral 3D em primeiro plano à direita (z = +0.58 -> paralaxe forte!)
            const table = new THREE.Group();
            const tblTopMat = new THREE.MeshLambertMaterial({ color: '#6b4226' });
            const tblLegMat = new THREE.MeshLambertMaterial({ color: '#472a16' });

            const top = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.09, 0.66), tblTopMat);
            top.position.set(0, 0.56, 0);
            top.castShadow = true; top.receiveShadow = true;

            const tLegs = [[-0.36, -0.24], [0.36, -0.24], [-0.36, 0.24], [0.36, 0.24]];
            for (let i = 0; i < tLegs.length; i++) {
              const l = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.026, 0.54, 8), tblLegMat);
              l.position.set(tLegs[i][0], 0.27, tLegs[i][1]);
              table.add(l);

            // Caneca low-poly em cima da mesinha

            );

            table.position.set(1.52, 0.0, 0.62);

            // Tapete central plano sobre o piso (y = 0.008 -> folga limpa acima do piso y = 0)
            const rug = new THREE.Mesh(

            );

          setSeasonBlend(winterFactor) {
            if (this.winterSkyMat) {
              this.winterSkyMat.opacity = clamp(winterFactor, 0, 1);
