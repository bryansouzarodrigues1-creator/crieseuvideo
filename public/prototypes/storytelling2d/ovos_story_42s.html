<div class="note" id="status">Storytelling 2D — demonstração original de 42 segundos, com exemplos financeiros ilustrativos. Sem narração: preparada para receber MP3 e marcas de palavras.</div></main>
<script>
'use strict';
const DURATION=42, FPS=30, stage=document.getElementById('stage');
const scenes=[0,1,2,3,4].map(n=>document.getElementById('s'+n));
const $=id=>document.getElementById(id), clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=(x)=>{x=clamp(x);return x*x*(3-2*x)};
const fade=(t,start,end,appear=.35,disappear=.3)=>ease((t-start)/appear)*(1-ease((t-(end-disappear))/disappear));
const entrance=(t,start,d=.55)=>ease((t-start)/d);
const setAlpha=(id,a)=>$(id).setAttribute('opacity',String(clamp(a)));
const setShift=(id,x,y=0,scale=1)=>$(id).setAttribute('transform',`translate(${x},${y}) scale(${scale})`);
const money=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
function buildHen(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="8" rx="39" ry="31" fill="#fffaf0" stroke="#213e3c" stroke-width="4"/><circle cx="28" cy="-22" r="25" fill="#fffaf0" stroke="#213e3c" stroke-width="4"/><path d="M48 -24L69 -16L48 -4" fill="#e3a241"/><path d="M17 -48L25 -69L35 -48L47 -67L49 -40" fill="#d45d52"/><circle cx="37" cy="-27" r="4"/><path d="M-22 34v17m36 -17v17" stroke="#e3a241" stroke-width="6"/><path d="M-38 -3l-22-21m21 27l-29-9" stroke="#fffaf0" stroke-width="10" stroke-linecap="round"/></g>`}
$('henGroup').innerHTML=Array.from({length:20},(_,i)=>buildHen((i%5)*118,(Math.floor(i/5))*128,.74).replace('<g transform=',`<g class="hen" data-idx="${i}" transform=`)).join('');
$('eggGrid').innerHTML=Array.from({length:20},(_,i)=>`<g class="egg" data-idx="${i}" transform="translate(${(i%5-2)*114} ${Math.floor(i/5)*98})"><ellipse rx="27" ry="36" fill="#efcd87" stroke="#ad8452" stroke-width="3"/><ellipse cx="-8" cy="-14" rx="7" ry="13" fill="#fff6da" opacity=".48"/></g>`).join('');
const hens=[...document.querySelectorAll('.hen')], eggs=[...document.querySelectorAll('.egg')];
const captions=[
[0,3.5,'Dois vendedores podem vender','o mesmo produto...'],
[3.5,8,'...e terminar o mês','com resultados diferentes.'],
[8,12,'Tudo começa com uma','granja e algumas galinhas.'],
[12,17,'Mais produção ajuda, mas','não garante mais lucro.'],
[17,22,'Veja um exemplo simples:','dinheiro que entra e sai.'],
[22,27,'Faturamento menos custos','não é sempre lucro final.'],
[27,32,'O crescimento exige','clientes e controle.'],
[32,36,'Guardar uma margem ajuda','a enfrentar imprevistos.'],
[36,42,'Vender é o começo.','Entender o lucro muda o jogo.']
];
let current=0,playing=false,last=0,raf=0,gsapDriver=null;
function renderAt(raw){let t=clamp(raw,0,DURATION);current=t;
 const times=[[0,8],[8,17],[17,27],[27,36],[36,42]];
 scenes.forEach((sc,i)=>{const [a,b]=times[i];const visible=t>=a&&t<(i===4?b+.001:b);sc.setAttribute('visibility',visible?'visible':'hidden'); sc.setAttribute('opacity',visible?'1':'0')});
 const cap=captions.find(c=>t>=c[0]&&t<c[1])||captions[captions.length-1];$('caption1').textContent=cap[2];$('caption2').textContent=cap[3];
 const capAlpha=Math.min(1,entrance(t,cap[0],.24)+.02);setAlpha('lowerThird',capAlpha);
 setAlpha('hookGroup',entrance(t,.1,.9));setShift('hookGroup',0,Math.round(25*(1-entrance(t,.1,.9))));
 setShift('vendorLeft',0,8*Math.sin(t*2.4),1);setShift('vendorRight',0,8*Math.sin(t*2.2+.7),1);
 setAlpha('compareMark',entrance(t,3,.5));
 const count=(t<12)?5:t<15?Math.min(20,5+Math.floor((t-12)*5)):20;
 $('henCountLabel').textContent=count+' GALINHAS';
 hens.forEach((h,i)=>{const alpha=entrance(t,8.35+i*.12,.36)*(i<count?1:0);h.setAttribute('opacity',clamp(alpha));});
 eggs.forEach((e,i)=>e.setAttribute('opacity',entrance(t,17.4+i*.06,.38)));
 setAlpha('calcTitle',entrance(t,17,.6));setAlpha('priceBlocks',entrance(t,19,.7));
 const p=entrance(t,20,.95),q=entrance(t,22,.9),r=entrance(t,24,.9);$('revenue').textContent=money(400*p);$('costs').textContent='− '+money(220*q);$('net').textContent=money(180*r);
 ["pathOne","pathTwo","pathThree"].forEach((id,i)=>setAlpha(id,entrance(t,27.5+i*1.3,.65)));
 $('growPath').setAttribute('stroke-dashoffset',String(1200*(1-entrance(t,32.2,2.2))));setAlpha('growCaption',entrance(t,33,.6));
 const f=entrance(t,36,.7);setShift('finalPlate',0,(1-f)*55,.9+.1*f);setAlpha('finalPlate',f);
 $('scrub').value=String(t);const sec=Math.floor(t),mm=String(Math.floor(sec/60)).padStart(2,'0'),ss=String(sec%60).padStart(2,'0');$('time').textContent=mm+':'+ss+' / 00:42';
}
window.storytelling={seek:renderAt,duration:DURATION,stage};
const useGsap=!!(window.gsap&&window.gsap.timeline);
if(useGsap){const proxy={t:0};gsapDriver=gsap.timeline({paused:true});gsapDriver.to(proxy,{t:DURATION,duration:DURATION,ease:'none',onUpdate:()=>renderAt(proxy.t)});}
function pause(){playing=false;$('play').textContent='▶ Reproduzir';if(gsapDriver)gsapDriver.pause();cancelAnimationFrame(raf)}
function play(){if(current>=DURATION)renderAt(0);playing=true;$('play').textContent='⏸ Pausar';if(gsapDriver){gsapDriver.seek(current).play();return}last=performance.now();const tick=now=>{if(!playing)return;const dt=Math.min(.1,(now-last)/1000);last=now;renderAt(current+dt);if(current>=DURATION){pause();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
$('play').onclick=()=>playing?pause():play();$('scrub').oninput=e=>{const was=playing;pause();renderAt(Number(e.target.value));if(was)play()};
async function exportVideo(){pause();const btn=$('export'),note=$('status');btn.disabled=true;btn.textContent='Preparando...';
 try{if(typeof MediaRecorder==='undefined'||!HTMLCanvasElement.prototype.captureStream)throw new Error('Navegador sem MediaRecorder/captureStream');
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;const ctx=canvas.getContext('2d',{alpha:false});const stream=canvas.captureStream(30);
 const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw new Error('Codec WebM não disponível');
 const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5200000});const blobs=[];rec.ondataavailable=e=>{if(e.data.size)blobs.push(e.data)};
 const finished=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=e=>reject(e.error||new Error('Erro de gravação'))});rec.start(1000);
 const serializer=new XMLSerializer();let start=performance.now();
 async function frame(){const seconds=Math.min(DURATION,(performance.now()-start)/1000);renderAt(seconds);const xml=serializer.serializeToString(stage);const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));const img=new Image();try{await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url});ctx.drawImage(img,0,0,1080,1920);}finally{URL.revokeObjectURL(url)}
 btn.textContent='Gravando '+Math.round(seconds/DURATION*100)+'%';if(seconds<DURATION)await new Promise(ok=>requestAnimationFrame(ok));return seconds<DURATION;}
 let remaining=true;while(remaining)remaining=await frame();await new Promise(ok=>setTimeout(ok,250));rec.stop();await finished;const blob=new Blob(blobs,{type:mime});const a=document.createElement('a');const obj=URL.createObjectURL(blob);a.href=obj;a.download='CrieSeuVideo_Storytelling2D_Ovos_42s.webm';a.click();setTimeout(()=>URL.revokeObjectURL(obj),3000);note.textContent='Exportação concluída. Este protótipo não contém narração; WebM gravado em tempo real.';
 }catch(e){note.textContent='Não foi possível exportar: '+e.message;}finally{btn.disabled=false;btn.textContent='Exportar .webm';renderAt(0)}
}
$('export').onclick=exportVideo;renderAt(0);
</script></body></html>
