name: Explicit Gemini 3D Repair Real Studio QA

on:
  push:
    branches: [feat/3d-explicit-repair-real-studio]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explicit-3d-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: All unit tests
        run: bun run test
      - name: Strict TypeScript
        run: bunx tsc --noEmit
      - name: Build app and lab
        run: |
          bun run build
          node lab/build.mjs
          bunx tsc --noEmit -p lab/tsconfig.json
      - name: Install Chromium
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
      - name: Real studio WebGL and explicit repair E2E (simulated Gemini)
        run: bun scripts/studio-freeform-3d-browser-qa.mjs
      - name: Upload real editor captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-3d-studio-browser-qa
          path: tmp/real-studio-3d-qa/
          if-no-files-found: ignore
          retention-days: 7
