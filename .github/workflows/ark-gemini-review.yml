name: Gemini corrects its ark using actual rendered frames
on:
  pull_request:
    branches: [feat/ark-tsunami-gemini-20261122]
    paths:
      - scripts/ark-gemini-review.ts
      - scripts/ark-gemini-render.mjs
      - .github/workflows/ark-gemini-review.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: ark-gemini-visual-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  revise-and-render:
    if: github.event.pull_request.head.ref == 'feat/ark-tsunami-gemini-review-20261122' && github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test src/studio/code3d/arkGeneration.test.ts
      - uses: actions/download-artifact@v4
        with:
          name: ark-gemini-20s
          run-id: 45011247705
          github-token: ${{ github.token }}
          path: tmp/ark-review-input/
      - name: Prepare actual player
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
          mkdir -p tmp/ark-gemini
          bunx vite --host 127.0.0.1 --port 4198 --strictPort >tmp/ark-gemini/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4198/motor-3d/codigo >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: One explicit Gemini revision with four actual rendered frames
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.FREEFORM_3D_GEMINI_API_KEY }}
          GEMINI_CODE3D_MODEL: gemini-3.6-flash
          ARK_REVIEW_CALL: ARK_VISUAL_REVIEW_20261122
        run: bun scripts/ark-gemini-review.ts
      - name: Render the Gemini revision unchanged, including its synthesized choir
        run: bun scripts/ark-gemini-render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ark-gemini-20s-reviewed
          path: tmp/ark-gemini/
          retention-days: 14
