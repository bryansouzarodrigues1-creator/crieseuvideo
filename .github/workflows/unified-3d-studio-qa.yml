name: Unified advanced 3D studio and provider diagnostics
on:
  push:
    branches: [fix/unify-ai-3d-studio-provider-auth-20261118, feat/inline-ai3d-main-editor-20261118]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: unified-3d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: All unit and integration tests (provider calls mocked)
        run: bun run test
      - name: Build routes and website
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Install browser for mobile UI proof
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
      - name: Start official CrieSeuVideo locally
        run: |
          mkdir -p tmp/unified-3d-qa
          bunx vite --host 127.0.0.1 --port 4198 --strictPort >tmp/unified-3d-qa/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4198/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -80 tmp/unified-3d-qa/vite.log
          exit 1
      - name: Verify inline 3D generation, optional handoff, zero unapproved billing
        run: bun scripts/advanced-3d-handoff-browser-qa.mjs
      - name: Render 12s smartphone assembly and capture timeline frames
        run: bun scripts/smartphone-assembly-browser-qa.mjs
      - name: Compare editorial 2D and 2.5D (offline fixture, no model calls)
        run: bun scripts/editorial-comparison-browser-qa.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-advanced-3d-browser-proof
          path: tmp/unified-3d-qa/
          retention-days: 7
          if-no-files-found: warn
