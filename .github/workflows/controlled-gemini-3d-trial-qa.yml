name: Controlled Gemini 3D Trial Security and Browser QA

on:
  push:
    branches: [feat/controlled-gemini-3d-trial]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlled-3d-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: 'true'
      FREEFORM_3D_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: All tests (mocked AI only)
        run: bun run test
      - name: TypeScript and build checks
        run: |
          bunx tsc --noEmit
          bun run build
          node lab/build.mjs
          bunx tsc --noEmit -p lab/tsconfig.json
      - name: Browser QA prerequisites
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
      - name: Owner session and real-studio WebGL with Gemini simulated
        run: bun scripts/studio-freeform-3d-browser-qa.mjs
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-gemini-3d-trial-evidence
          path: tmp/real-studio-3d-qa/
          if-no-files-found: ignore
          retention-days: 7
