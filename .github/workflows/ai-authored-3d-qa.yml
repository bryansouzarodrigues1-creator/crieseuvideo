name: AI-authored 3D world preview QA
on:
  push:
    branches: [feat/ai-authored-3d-worlds-20261118]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai3d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Tests (no real model calls)
        run: bun run test
      - name: Build and generate TanStack route types
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Browser dependencies
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
      - name: Start local preview
        run: |
          mkdir -p tmp/ai-3d-qa
          bunx vite --host 127.0.0.1 --port 4198 --strictPort >tmp/ai-3d-qa/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4198/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -70 tmp/ai-3d-qa/vite.log
          exit 1
      - name: Verify first screen without any AI billing
        run: bun scripts/ai-authored-3d-browser-qa.mjs
      - name: Screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-3d-studio-mobile-ui
          path: tmp/ai-3d-qa/
          retention-days: 7
          if-no-files-found: warn
