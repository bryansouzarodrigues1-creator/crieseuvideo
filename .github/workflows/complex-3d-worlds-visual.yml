name: Complex 3D worlds - ark prison motorcycle visual QA
on:
  push:
    branches: [feat/complex-3d-world-batches-20261118]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complex-3d-worlds-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CI: 'true'
      FREEFORM_3D_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install headless WebGL and video tooling
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Serve three independently assembled 3D worlds
        run: |
          mkdir -p tmp/complex-worlds
          bunx vite lab/complex-worlds --host 127.0.0.1 --port 4198 --strictPort >tmp/complex-worlds/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4198/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 tmp/complex-worlds/vite.log
          exit 1
      - name: Confirm real geometry, story motion, framing and export H264 18s
        run: bun scripts/complex-worlds-browser-qa.mjs
      - name: Upload actual 18s video, nine frames and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complex-worlds-ark-prison-motorcycle-18s
          path: tmp/complex-worlds/
          retention-days: 7
          if-no-files-found: warn
