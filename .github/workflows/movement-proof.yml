name: Contact and acting helpers through the actual studio
on:
  pull_request:
    branches: [test/viral-construction-reference-20261121]
    paths:
      - src/studio/code3d/**
      - src/studio/components/Code3DStudio.tsx
      - scripts/movement-browser.mjs
      - scripts/fixtures/movement.render.json
      - scripts/fixtures/construction-study.js
      - .github/workflows/movement-proof.yml
permissions:
  contents: read
concurrency:
  group: movement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Offline invariant and compatibility tests
        run: bun run test
      - name: Build and typecheck real app
        run: |
          bun run build
          bunx tsc --noEmit
      - name: Prepare browser and studio
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
          mkdir -p tmp/movement-logs
          bunx vite --host 127.0.0.1 --port 4198 --strictPort >tmp/movement-logs/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4198/motor-3d/codigo >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Render movement trial and check both scene contracts
        run: bun scripts/movement-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movement-real-engine
          path: |
            tmp/movement-preview/
            tmp/movement-full/
            tmp/movement-logs/
          retention-days: 14
