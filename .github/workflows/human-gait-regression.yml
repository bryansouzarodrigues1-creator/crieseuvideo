name: Humanized 3D full regression offline
# Unit suite plus TypeScript checks across all earlier scene types. No provider secrets.
on:
  push:
    branches: [experiment/human-motion-crane-20261117]
    paths:
      - 'src/studio/explainer/sceneProgram/**'
      - '.github/workflows/human-gait-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      FREEFORM_3D_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run complete unit regression suite (no real provider calls)
        run: bun run test
      - name: Verify TypeScript
        run: bunx tsc --noEmit
