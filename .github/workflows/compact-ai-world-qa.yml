name: Compact AI World Generator QA
on:
  push:
    branches: [feat/compact-ai-world-builder-20261119]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: compact-ai-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test procedural worlds and existing project
        run: bun run test
      - name: Build site and generate TanStack route types
        run: bun run build
      - name: Typecheck entire website
        run: bunx tsc --noEmit
