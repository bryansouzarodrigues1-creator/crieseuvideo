name: Compact AI World Generator QA
on:
  push:
    branches: [feat/compact-ai-world-builder-20261119]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: compact-ai-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test procedural worlds and existing project
        run: bun run test
      - name: Build site and generate TanStack route types
        run: bun run build
      - name: Typecheck entire website
        run: bunx tsc --noEmit
      - name: Install Chromium for actual 3D render validation
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
      - name: Start site for real WebGL test
        run: |
          mkdir -p tmp/compact-ai-worlds
          bunx vite --host 127.0.0.1 --port 4198 --strictPort >tmp/compact-ai-worlds/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4198/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 tmp/compact-ai-worlds/vite.log
          exit 1
      - name: Render three moving WebGL worlds and compare frames
        run: bun scripts/compact-ai-world-browser-qa.mjs
      - name: Archive visual QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-ai-worlds-visual-qa
          path: tmp/compact-ai-worlds/
          retention-days: 7
          if-no-files-found: warn
