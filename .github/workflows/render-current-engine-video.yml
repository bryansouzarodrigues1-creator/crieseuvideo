name: Render standalone video with current SceneProgram3D
on:
  push:
    branches:
      - experiment/render-current-3d-crane-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-mp4:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked project dependencies
        run: bun install --frozen-lockfile
      - name: Compile the existing engine
        run: |
          bun run build
          bunx tsc --noEmit
      - name: Install Chromium renderer
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
      - name: Start original CrieSeuVideo engine
        run: |
          mkdir -p tmp/current-engine-video
          bunx vite --host 127.0.0.1 --port 4198 --strictPort >tmp/current-engine-video/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4198/render-engine-clip.html >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 tmp/current-engine-video/vite.log
          exit 1
      - name: Draw every frame with Stage3D and capture film
        run: bun scripts/render-current-engine-video.mjs
      - name: Encode MP4 and verify playback metadata
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -y -v error -framerate 18 -i tmp/current-engine-video/frames/f%04d.png -c:v libx264 -crf 19 -preset medium -pix_fmt yuv420p -r 18 -movflags +faststart tmp/current-engine-video/CrieSeuVideo_Grua_Teste_Motor_Atual.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json tmp/current-engine-video/CrieSeuVideo_Grua_Teste_Motor_Atual.mp4 >tmp/current-engine-video/video-metadata.json
          ffmpeg -y -v error -i tmp/current-engine-video/CrieSeuVideo_Grua_Teste_Motor_Atual.mp4 -vf "fps=1/3,scale=288:512,tile=4x1" -frames:v 1 tmp/current-engine-video/storyboard.png
          test -s tmp/current-engine-video/CrieSeuVideo_Grua_Teste_Motor_Atual.mp4
          cat tmp/current-engine-video/video-metadata.json
      - name: Upload MP4, storyboard and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crieseuvideo-rendered-grua-12s
          path: |
            tmp/current-engine-video/CrieSeuVideo_Grua_Teste_Motor_Atual.mp4
            tmp/current-engine-video/storyboard.png
            tmp/current-engine-video/video-metadata.json
            tmp/current-engine-video/render-report.json
            tmp/current-engine-video/vite.log
          retention-days: 7
          if-no-files-found: warn
