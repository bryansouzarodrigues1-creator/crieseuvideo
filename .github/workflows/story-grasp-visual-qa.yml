name: 3D Story Grip - actual Chromium H264 preview
on:
  push:
    branches: [feat/story-grasp-contacts-20261118]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: story-grasp-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-3d-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: 'true'
      FREEFORM_3D_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Install headless WebGL and H264
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Start original story 3D proof with IK hand targets
        run: |
          mkdir -p tmp/story-events-3d
          bunx vite lab/story-events-3d --host 127.0.0.1 --port 4199 --strictPort >tmp/story-events-3d/vite.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4199/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -80 tmp/story-events-3d/vite.log
          exit 1
      - name: Render full 14-second H264 narrative with grasp contacts
        run: bun scripts/story-events-3d-browser-qa.mjs
      - name: Save actual MP4 and frames for human critique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-grasp-3d-14s-real-frames
          path: tmp/story-events-3d/
          retention-days: 7
          if-no-files-found: warn
