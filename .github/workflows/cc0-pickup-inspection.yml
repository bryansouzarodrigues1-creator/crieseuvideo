name: Research CC0 authored pickup and locomotion clips
# Isolated research only: source-verified GLB animation metadata.
# No main merge, production deployment, Gemini, or paid API.
on:
  push:
    branches: [experiment/rigged-clip-matrix-audit-20261117]
    paths:
      - '.github/workflows/cc0-pickup-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve pinned-by-checksum CC0 animation library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/cc0-motion-audit
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            'https://huggingface.co/datasets/Kinemiq/free-game-animations/resolve/main/KinemIQ_Free_Animations_CC0_GLB.zip' \
            -o tmp/cc0-motion-audit/motions.zip
          echo '64ca5ab4a92c9da079c5e88ca509391b0a58a24ccf2a1307b16e2f0fc6b23ffc  tmp/cc0-motion-audit/motions.zip' | sha256sum -c -
      - name: Audit motion inventory, animation channels and skeleton without inventing actions
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, json, hashlib, re, struct
          from pathlib import Path
          archive=Path('tmp/cc0-motion-audit/motions.zip')
          output=Path('tmp/cc0-motion-audit/catalog.json')
          report={'source':'Kinemiq/free-game-animations',
                  'upstreamOriginal':'Quaternius Universal Animation Library',
                  'licenseClaim':'CC0 1.0 (verify source before production)',
                  'zipSha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
                  'assets':[],'candidateMotions':[],'warnings':[]}
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              report['zipEntryCount']=len(names)
              for name in names:
                  if not name.lower().endswith('.glb'):continue
                  data=z.read(name)
                  if len(data)<20 or data[:4]!=b'glTF' or struct.unpack_from('<I',data,4)[0]!=2:
                      report['warnings'].append('Invalid binary GLB: '+name)
                      continue
                  json_size,tag=struct.unpack_from('<I4s',data,12)
                  if tag!=b'JSON' or 20+json_size>len(data):
                      report['warnings'].append('Invalid GLB JSON chunk: '+name)
                      continue
                  gltf=json.loads(data[20:20+json_size])
                  motions=[a.get('name','') for a in gltf.get('animations',[])]
                  channels=sum(len(a.get('channels',[])) for a in gltf.get('animations',[]))
                  item={'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),
                        'skins':len(gltf.get('skins',[])),'nodes':len(gltf.get('nodes',[])),
                        'animationCount':len(motions),'animationNames':motions,
                        'animationChannels':channels}
                  report['assets'].append(item)
                  if re.search('pick|grab|crouch|carry|bend|walk', name+' '+' '.join(motions),re.I):
                      report['candidateMotions'].append(item)
          output.write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print('AUDIT',json.dumps({'totalGLBs':len(report['assets']),
                                  'candidateFiles':[x['path'] for x in report['candidateMotions']],
                                  'warnings':report['warnings']}))
          if len(report['assets'])<1:raise SystemExit('No valid authored GLB files found')
          if not report['candidateMotions']:raise SystemExit('No candidate motion names found; do not claim usable pickup')
          PY
      - name: Compare source clip skeleton with Quaternius Worker bones
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/nishit47/Blender-Pre-vis-Pipeline---Screenplay-to-Animatic/6d6de54a1d7143cf5487462d147bbef039de4837/assets/Ultimate%20Modular%20Men%20Pack-glb/Worker.glb' \
            -o tmp/cc0-motion-audit/Worker.glb
          test "$(git hash-object tmp/cc0-motion-audit/Worker.glb)" = eb29e2adb795972e1f475cd25a000975fe260aa9
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json,struct,re
          def glb_json(data):
              if data[:4]!=b'glTF':raise ValueError('Not GLB')
              size=struct.unpack_from('<I',data,12)[0]
              return json.loads(data[20:20+size])
          def normalize(name):
              return re.sub(r'[^a-z0-9]','',name.lower())
          worker=glb_json(Path('tmp/cc0-motion-audit/Worker.glb').read_bytes())
          with zipfile.ZipFile('tmp/cc0-motion-audit/motions.zip') as z:
              src=glb_json(z.read('GLB/Action_pick_up_from_a_table.glb'))
          src_nodes=src.get('nodes',[])
          dst_nodes=worker.get('nodes',[])
          src_animated_nodes=sorted(set(ch['target']['node'] for a in src.get('animations',[]) for ch in a.get('channels',[])))
          worker_bones=sorted(set(joint for skin in worker.get('skins',[]) for joint in skin.get('joints',[])))
          src_names=[src_nodes[i].get('name','') for i in src_animated_nodes]
          dst_names=[dst_nodes[i].get('name','') for i in worker_bones]
          target_map={normalize(x):x for x in dst_names}
          common=[x for x in src_names if normalize(x) in target_map]
          report={
            'source':'GLB/Action_pick_up_from_a_table.glb',
            'target':'Quaternius Worker.glb SHA eb29e2adb795972e1f475cd25a000975fe260aa9',
            'sourceAnimatedBoneNames':src_names,
            'targetSkinnedJointNames':dst_names,
            'matchingNormalizedNames':common,
            'matchFraction':round(len(common)/max(1,len(src_names)),4),
            'sourceNodeCount':len(src_nodes),
            'targetJointCount':len(worker_bones),
            'recommendation':'Never copy keyframes onto unrelated joints. Calibrate bind-pose and retarget in a new isolated browser proof.'
          }
          Path('tmp/cc0-motion-audit/retarget-audit.json').write_text(json.dumps(report,indent=2))
          print('RETARGET AUDIT',json.dumps({k:v for k,v in report.items() if k not in ('sourceAnimatedBoneNames','targetSkinnedJointNames')}))
          print('SOURCE BONES',json.dumps(src_names[:50]))
          print('TARGET BONES',json.dumps(dst_names[:50]))
          if len(src_names)<20 or len(dst_names)<20:
              raise SystemExit('Missing real skeleton channels/joints')
          PY
      - name: Save inspection report (no production asset deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc0-motion-source-inventory
          path: |
            tmp/cc0-motion-audit/catalog.json
            tmp/cc0-motion-audit/retarget-audit.json
          if-no-files-found: warn
          retention-days: 7
