name: Code 3D provider metadata check (no generation)
on:
  push:
    branches: [run/code3d-model-metadata-20261120]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: oven-sh/setup-bun@v2
      - name: Check only model metadata without requesting generated content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.FREEFORM_3D_GEMINI_API_KEY }}
        run: |
          bun - <<'JS'
          const key=process.env.GEMINI_API_KEY;
          if(!key){console.log('MODEL_METADATA missing_key');process.exit(2);}
          const models=['gemini-3.8-flash','gemini-3.6-flash'];
          await Promise.all(models.map(async model=>{
            const start=Date.now();
            try{
              const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model,{headers:{'x-goog-api-key':key},signal:AbortSignal.timeout(20000)});
              let methods=[];if(r.ok){const m=await r.json();methods=Array.isArray(m.supportedGenerationMethods)?m.supportedGenerationMethods.filter(x=>x==='generateContent'):[];}
              console.log('MODEL_METADATA '+JSON.stringify({model,status:r.status,generateContent:methods.includes('generateContent'),elapsedMs:Date.now()-start}));
            }catch{console.log('MODEL_METADATA '+JSON.stringify({model,failure:'no_response_within_20s',elapsedMs:Date.now()-start}));}
          }));
          JS
