name: Cross-scene 3D mechanics and environments
on:
  push:
    branches: [feat/multi-scene-mechanics-20261118]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multi-scene-mechanics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      FREEFORM_3D_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Full regression including three real 3D mechanical scenes
        run: bun run test
      - name: Static type checking
        run: bunx tsc --noEmit
      - name: Compile full application without deployment
        run: bun run build
