name: 3D Story Events Planner - semantic state QA
on:
  push:
    branches:
      - feat/story-events-planner-20261117
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: story-events-planner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      FREEFORM_3D_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install pinned project dependencies
        run: bun install --frozen-lockfile
      - name: Full regression tests (no AI call)
        run: bun run test
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Production compile without publication
        run: bun run build
