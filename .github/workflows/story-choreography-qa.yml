name: Story choreography QA

on:
  push:
    branches:
      - feat/story-action-choreography
  pull_request:
    branches:
      - work/export-capture-guard-2026-11-14
  workflow_dispatch:

concurrency:
  group: story-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Laboratory build
        run: node lab/build.mjs
      - name: Laboratory typecheck
        run: bunx tsc --noEmit -p lab/tsconfig.json
      - name: Install Playwright browser for isolated visual smoke
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
      - name: Visual browser smoke (without AI keys)
        run: node scripts/lab-browser-smoke.mjs
      - name: Upload visual QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-choreography-frames
          path: tmp/story-browser-qa/
          if-no-files-found: ignore
          retention-days: 7
