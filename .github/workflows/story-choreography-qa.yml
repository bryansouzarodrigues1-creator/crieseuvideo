name: Story choreography QA

on:
  push:
    branches:
      - feat/story-action-choreography
      - feat/grounded-3d-performance
  pull_request:
    branches:
      - work/export-capture-guard-2026-11-14
      - feat/story-action-choreography
  workflow_dispatch:

concurrency:
  group: story-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Laboratory build
        run: node lab/build.mjs
      - name: Laboratory typecheck
        run: bunx tsc --noEmit -p lab/tsconfig.json
      - name: Install Playwright browser for isolated visual smoke
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
      - name: Visual browser smoke (without AI keys)
        run: node scripts/lab-browser-smoke.mjs
      - name: Verify ffmpeg availability
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Export full 18s grounded 3D in both aspects (no AI calls)
        run: node scripts/export-grounded-mp4.mjs
      - name: Upload animated MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crieseuvideo-lia-caio-mp4
          path: |
            tmp/grounded-performance/*.mp4
            tmp/grounded-performance/*report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload visual QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-choreography-frames
          path: |
            tmp/story-browser-qa/
            tmp/grounded-performance/vertical/f00000.png
            tmp/grounded-performance/vertical/f00165.png
            tmp/grounded-performance/vertical/f00270.png
            tmp/grounded-performance/vertical/f00390.png
            tmp/grounded-performance/vertical/f00480.png
            tmp/grounded-performance/horizontal/f00165.png
            tmp/grounded-performance/horizontal/f00390.png
          if-no-files-found: ignore
          retention-days: 7
