name: Story choreography QA

on:
  push:
    branches:
      - feat/story-action-choreography
      - feat/grounded-3d-performance
  pull_request:
    branches:
      - work/export-capture-guard-2026-11-14
      - feat/story-action-choreography
      - feat/grounded-3d-performance
  workflow_dispatch:

concurrency:
  group: story-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Laboratory build
        run: node lab/build.mjs
      - name: Laboratory typecheck
        run: bunx tsc --noEmit -p lab/tsconfig.json
      - name: Install Playwright browser for isolated visual smoke
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
      - name: Visual browser smoke (without AI keys)
        run: node scripts/lab-browser-smoke.mjs
      - name: Verify ffmpeg availability
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Ordinary input and user duration - samples first
        run: node scripts/normal-workflow-qa.mjs --samples
      - name: Upload normal workflow samples before long render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-workflow-samples
          path: |
            tmp/normal-workflow/*.png
            tmp/normal-workflow/samples-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Export ordinary 60s and 30s videos without AI calls
        run: node scripts/normal-workflow-qa.mjs --full
      - name: Upload animated MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-workflow-mp4
          path: |
            tmp/normal-workflow/*.mp4
            tmp/normal-workflow/*report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload visual QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-choreography-frames
          path: |
            tmp/story-browser-qa/
            tmp/grounded-performance/vertical/f00000.png
            tmp/grounded-performance/vertical/f00165.png
            tmp/grounded-performance/vertical/f00270.png
            tmp/grounded-performance/vertical/f00390.png
            tmp/grounded-performance/vertical/f00480.png
            tmp/grounded-performance/horizontal/f00165.png
            tmp/grounded-performance/horizontal/f00390.png
          if-no-files-found: ignore
          retention-days: 7
