name: Director response QA
on:
  pull_request:
    branches: [feat/narrative-staging-duration, feat/composable-3d-production, fix/director-action-contract, fix/gemini-request-and-empty-start, fix/uncertainty-action-grounding, fix/explicit-3d-capability-boundary]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: director-response-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  response-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Check the reference capability contract independently
        run: |
          python3 -m pip install -r scripts/requirements-schema.txt
          node scripts/director-schema-qa.mjs
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: node lab/build.mjs
      - run: bunx tsc --noEmit -p lab/tsconfig.json
      - name: Install browser
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Check failure recovery through the ordinary mobile UI
        run: node scripts/director-response-qa.mjs
      - name: Preserve ordinary story and native video export
        run: |
          node scripts/lab-browser-smoke.mjs
          node scripts/production-workflow-qa.mjs --samples
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: director-response-qa
          path: tmp/director-response-qa/
          retention-days: 7
