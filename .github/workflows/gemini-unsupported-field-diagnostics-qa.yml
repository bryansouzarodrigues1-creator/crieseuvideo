name: Gemini 3D Safe Schema Diagnostic QA

on:
  push:
    branches: [fix/gemini-unsupported-field-diagnostics]

permissions:
  contents: read

concurrency:
  group: gemini-schema-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CI: 'true'
      FREEFORM_3D_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test all code and security regressions without any AI calls
        run: bun run test
      - name: Strict typecheck and app/lab builds
        run: |
          bunx tsc --noEmit
          bun run build
          node lab/build.mjs
          bunx tsc --noEmit -p lab/tsconfig.json
      - name: Live Gemini CLI must stay offline by default
        run: bun scripts/controlled-gemini-3d-trial.ts
