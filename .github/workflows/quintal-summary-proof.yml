name: Twenty-second garden assembly summary
on:
  pull_request:
    branches: [feat/quintal-explainer-20261121]
    paths:
      - scripts/fixtures/quintal-summary.fragment.js
      - scripts/quintal-summary-browser.mjs
      - .github/workflows/quintal-summary-proof.yml
permissions:
  contents: read
concurrency:
  group: quintal-summary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node --check scripts/quintal-summary-browser.mjs
      - name: Prepare actual studio
        run: |
          bun add --no-save playwright@1.57.0
          bunx playwright install chromium
          mkdir -p tmp/quintal-summary-logs
          bunx vite --host 127.0.0.1 --port 4198 --strictPort >tmp/quintal-summary-logs/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4198/motor-3d/codigo >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Render only twenty seconds
        run: bun scripts/quintal-summary-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quintal-summary-20s
          path: |
            tmp/quintal-summary/
            tmp/quintal-summary-logs/
          retention-days: 14
